<body>

  <a href="#projects-section" class="skip-link">Skip to projects</a>

  <header id="site-header" class="scrolled">
    <a href="index.html" class="header-logo">Khaled Korfali<span>.</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="projects.html" class="active" aria-current="page">Projects</a>
      <a href="index.html#about">About</a>
      <a href="https://github.com/KhaledKorfali2" rel="noopener">GitHub</a>
    </nav>
  </header>

  <section class="hero-light" id="hero-light">
    <canvas id="particle-canvas-sm" aria-hidden="true"></canvas>
    <div class="hero-light-inner">
      <p class="hero-eyebrow fade-up fade-up-1">The Collection</p>
      <h1 class="fade-up fade-up-2">All <em id="scramble-em-p">projects.</em></h1>
      <p class="hero-description fade-up fade-up-3">
        From physics simulations to Quranic Arabic tools — everything I've built and actually shipped.
      </p>
      <div class="hero-actions fade-up fade-up-4">
        <div class="category-tags" id="filterTags" role="group" aria-label="Filter projects by category">
          <button class="tag active" data-filter="all">All</button>
          <button class="tag" data-filter="security">Security</button>
          <button class="tag" data-filter="simulation">Simulation</button>
          <button class="tag" data-filter="arabic">Arabic Learning</button>
          <button class="tag" data-filter="programming">Programming</button>
        </div>
      </div>
    </div>
  </section>

  <div class="section-divider"></div>

  <main id="projects-section" tabindex="-1">
    <p class="grid-status" id="gridStatus" role="status" aria-live="polite"></p>
    <ul class="grid-container" id="projectsGrid"></ul>
  </main>

  <footer>
    <p>&copy; Khaled Korfali. Built with JavaScript, WebAssembly &amp; curiosity.</p>
    <p><a href="index.html" class="footer-link">Home</a> &middot; <a href="https://github.com/KhaledKorfali2" class="footer-link" rel="noopener">GitHub</a></p>
  </footer>

  <script src="script.js"></script>
  <script>
  (function() {

    /* ── Header ── */
    var header  = document.getElementById('site-header');
    var heroSm  = document.getElementById('hero-light');
    function updateHeader() {
      var heroBottom = heroSm.offsetTop + heroSm.offsetHeight;
      header.className = window.scrollY > heroBottom - 60 ? 'light' : 'scrolled';
    }
    window.addEventListener('scroll', updateHeader, { passive: true });
    updateHeader();

    /* ── Particle canvas (compact hero) ── */
    startParticles(document.getElementById('particle-canvas-sm'), heroSm, {
      count: 55, link: 120, speed: 0.3, repel: 100,
      radius: 1.1, alpha: 0.55, lineAlpha: 0.16
    });

    /* ── Text scramble ── */
    scrambleText(document.getElementById('scramble-em-p'), 28, 500);

    /* ── Grid render ── */
    var reveal  = makeRevealer(0.08);
    var grid    = document.getElementById('projectsGrid');
    var status  = document.getElementById('gridStatus');
    var tags    = document.querySelectorAll('.tag');

    function filterProjects(filter) {
      return filter === 'all' ? projects : projects.filter(function(p) { return p.category === filter; });
    }

    function renderGrid(filter) {
      grid.innerHTML = '';
      var filtered = filterProjects(filter);
      status.textContent = filtered.length + (filtered.length === 1 ? ' project' : ' projects') +
        (filter === 'all' ? '' : ' in ' + categoryLabel(filter));

      if (filtered.length === 0) {
        grid.innerHTML = '<li class="empty-state">No projects in this category yet.</li>';
        return;
      }

      filtered.forEach(function(project, i) {
        var li = projectCard(project, i, i < 3);
        grid.appendChild(li);
        reveal(li);
      });
    }

    function setFilter(filter, updateUrl) {
      var valid = false;
      for (var i=0;i<tags.length;i++) {
        if (tags[i].getAttribute('data-filter') === filter) valid = true;
      }
      if (!valid) filter = 'all';
      for (var j=0;j<tags.length;j++) {
        var on = tags[j].getAttribute('data-filter') === filter;
        tags[j].classList.toggle('active', on);
        tags[j].setAttribute('aria-pressed', on ? 'true' : 'false');
      }
      renderGrid(filter);
      if (updateUrl) {
        history.replaceState(null, '', filter === 'all' ? location.pathname : '#' + filter);
      }
    }

    /* Show a count on each filter so empty categories are obvious */
    for (var t=0; t<tags.length; t++) {
      (function(tag) {
        var count = document.createElement('span');
        count.className = 'tag-count';
        count.textContent = filterProjects(tag.getAttribute('data-filter')).length;
        tag.appendChild(count);
        tag.addEventListener('click', function() {
          setFilter(tag.getAttribute('data-filter'), true);
        });
      })(tags[t]);
    }

    window.addEventListener('hashchange', function() { setFilter(location.hash.slice(1), false); });
    setFilter(location.hash.slice(1), false);

  })();
  </script>
</body>
</html>
