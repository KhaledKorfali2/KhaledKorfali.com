<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--
  Only this site's own script files run (no inline script, no other origins).
  'wasm-unsafe-eval' lets the bundled OpenCascade WebAssembly kernel compile, and
  'unsafe-eval' is needed because its Emscripten binding layer (vendor/replicad_single.js)
  generates its glue functions with `new Function` from metadata inside the .wasm file.
  Nothing a learner types is ever evaluated; all input is handled as numbers and text.
  connect-src 'self' fetches the kernel from vendor/; blob: is for exported STL/STEP files.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Datum: Learn CAD by Building</title>
<meta name="description" content="A hands-on CAD course in your browser. Each challenge shows a part and a drawing; sketch, extrude, cut, fillet and shell until your solid matches, then capture the flag. Built on a real CAD kernel, with STL and STEP export for 3D printing.">
<meta name="theme-color" content="#07090c">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2307090c'/%3E%3Cpath d='M16 5l9 5v12l-9 5-9-5V10z M7 10l9 5 9-5 M16 15v12' fill='none' stroke='%23ff9f5a' stroke-width='2.2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/cad.css">
</head>
