<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boid Simulator — Flocking Fish</title>
  <meta name="description" content="Interactive boids flocking simulation: tune alignment, cohesion and separation, drop food for the fish, and draw barriers for them to swim around.">
  <meta name="theme-color" content="#05080f">
  <link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c0c0c'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23e8541a'/%3E%3C/svg%3E">
<link rel="canonical" href="https://khaledkorfali.com/projects/boid-simulator/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Khaled Korfali">
<meta property="og:title" content="Boid Simulator — Khaled Korfali">
<meta property="og:description" content="Interactive boids flocking simulation: tune alignment, cohesion and separation, drop food for the fish, and draw barriers for them to swim around.">
<meta property="og:url" content="https://khaledkorfali.com/projects/boid-simulator/">
<meta property="og:image" content="https://khaledkorfali.com/screenshots/boid-simulator.webp">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>
  <canvas id="canvas" role="img" aria-label="Flocking fish simulation. Click or tap to drop food."></canvas>

  <a id="backLink" href="/projects.html" aria-label="Back to projects">←<span class="back-text"> Projects</span></a>

  <div id="settingsDropdown">

    <button id="settingsBtn" type="button" aria-expanded="false" aria-controls="settingsContent" title="Settings (S)">
      <span class="icon" aria-hidden="true">⚙</span>
      <span class="text">Settings</span>
      <span class="arrow" aria-hidden="true">▼</span>
    </button>

    <div id="settingsContent">

      <!-- ── Flock ── -->
      <div class="section-label">Flock</div>

      <div class="slider-group">
        <label for="countSlider">Count</label>
        <div class="slider-row">
          <input type="range" id="countSlider" min="10" max="200" step="1" value="80">
          <span id="countValue">80</span>
        </div>
      </div>

      <div class="slider-group">
        <label for="velocitySlider">Velocity</label>
        <div class="slider-row">
          <input type="range" id="velocitySlider" min="1" max="10" step="0.1" value="5">
          <span id="velocityValue">5</span>
        </div>
      </div>

      <div class="slider-group">
        <label for="alignSlider">Alignment</label>
        <div class="slider-row">
          <input type="range" id="alignSlider" min="0" max="2" step="0.05" value="1">
          <span id="alignValue">1</span>
        </div>
      </div>

      <div class="slider-group">
        <label for="cohesionSlider">Cohesion</label>
        <div class="slider-row">
          <input type="range" id="cohesionSlider" min="0" max="2" step="0.05" value="1">
          <span id="cohesionValue">1</span>
        </div>
      </div>

      <div class="slider-group">
        <label for="separationSlider">Separation</label>
        <div class="slider-row">
          <input type="range" id="separationSlider" min="0" max="2" step="0.05" value="1">
          <span id="separationValue">1</span>
        </div>
      </div>

      <div class="divider"></div>

      <!-- ── Colour Palette ── -->
      <div class="section-label">Colour Palette</div>
      <div id="paletteContainer" class="palette-grid"></div>
      <div id="customEditor" class="custom-editor"></div>

      <div class="divider"></div>

      <!-- ── Visual ── -->
      <div class="section-label">Visual</div>

      <label class="toggle-row">
        <span>Motion trails</span>
        <span class="pill-toggle">
          <input type="checkbox" id="trailToggle">
          <span class="pill-track" aria-hidden="true"></span>
        </span>
      </label>

      <div class="divider"></div>

      <!-- ── Barriers ── -->
      <div class="section-label">Barriers</div>

      <div class="barrier-btns">
        <button id="barrierModeBtn" type="button" class="tool-btn" aria-pressed="false" title="Draw barriers (D)"><span aria-hidden="true">✏</span> Draw</button>
        <button id="eraserModeBtn"  type="button" class="tool-btn" aria-pressed="false" title="Erase barriers (E)"><span aria-hidden="true">⌫</span> Erase</button>
      </div>
      <button id="clearBarriersBtn" type="button" class="clear-btn">Clear all barriers</button>

      <div class="divider"></div>

      <button id="resetBtn" type="button" class="reset-btn" title="Reset flock (R)"><span aria-hidden="true">↺</span> Reset Flock</button>

      <div class="divider"></div>

      <!-- ── Shortcuts ── -->
      <div class="section-label">Shortcuts</div>
      <dl class="shortcuts">
        <div><dt><kbd>Click</kbd></dt><dd>Drop food</dd></div>
        <div><dt><kbd>Space</kbd></dt><dd>Pause / resume</dd></div>
        <div><dt><kbd>R</kbd></dt><dd>Reset flock</dd></div>
        <div><dt><kbd>T</kbd></dt><dd>Toggle trails</dd></div>
        <div><dt><kbd>D</kbd> / <kbd>E</kbd></dt><dd>Draw / erase barriers</dd></div>
        <div><dt><kbd>S</kbd> / <kbd>Esc</kbd></dt><dd>Open / close settings</dd></div>
      </dl>

    </div>
  </div>

  <div id="modeIndicator" class="mode-indicator" role="status" aria-live="polite" style="display:none;"></div>

  <script type="module" src="script.js"></script>
</body>
</html>
