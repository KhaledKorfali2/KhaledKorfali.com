<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Arabic Roots Explorer</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">

  <main class="screen">

    <!-- LEARN — the root/branch centerpiece -->
    <section id="view-learn" class="view active">
      <div class="root-stage">
        <button class="root-nav-arrow left" onclick="stepRoot(-1)" aria-label="Previous root">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

        <div class="tree-wrap" id="tree-wrap">
          <svg class="tree-svg" id="tree-svg" viewBox="0 0 400 440" preserveAspectRatio="xMidYMin meet"></svg>
          <div class="medallion" id="medallion">
            <span class="medallion-letters arabic" id="medallion-letters"></span>
          </div>
          <div class="medallion-meaning" id="medallion-meaning"></div>
        </div>

        <button class="root-nav-arrow right" onclick="stepRoot(1)" aria-label="Next root">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M9 18l6-6-6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="root-dots" id="root-dots"></div>

      <div class="word-detail" id="word-detail"></div>
    </section>

    <!-- PRACTICE -->
    <section id="view-practice" class="view">
      <div class="practice-progress" id="practice-progress"></div>
      <p class="practice-prompt" id="practice-prompt"></p>
      <div class="practice-stage">
        <div class="slot-row" id="practice-slots"></div>
        <div class="chip-row bank-row" id="practice-bank"></div>
        <div class="practice-actions">
          <button class="primary-btn full-width" id="practice-check" style="display:none" onclick="checkAnswer()">Check</button>
          <button class="primary-btn full-width" id="practice-next" style="display:none" onclick="startPractice()">
            Next word
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 18l6-6-6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="result-panel" id="practice-result"></div>
      </div>
    </section>

    <!-- CONJUGATE -->
    <section id="view-conjugate" class="view">
      <div class="conj-root-header">
        <button class="root-nav-arrow small" onclick="stepRoot(-1)" aria-label="Previous root">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="conj-root-label">
          <span class="arabic" id="conj-header-letters"></span>
          <span id="conj-header-meaning"></span>
        </div>
        <button class="root-nav-arrow small" onclick="stepRoot(1)" aria-label="Next root">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 18l6-6-6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="conjugate-controls">
        <div class="segmented full-bleed" id="tense-segmented">
          <button data-table="past" onclick="setTable('past')">Past</button>
          <button data-table="present" onclick="setTable('present')">Present</button>
          <button data-table="commands" onclick="setTable('commands')">Commands</button>
        </div>
        <button class="icon-toggle" id="diacritics-btn" onclick="toggleDiacritics()">
          <span class="arabic">ً</span> Diacritics
        </button>
      </div>

      <div class="commands-subtoggle" id="commands-subtoggle" hidden>
        <button data-cmd="imperative" onclick="setCommandType('imperative')">Do this <span class="arabic">— الأمر</span></button>
        <button data-cmd="negative" onclick="setCommandType('negative')">Don't <span class="arabic">— النهي</span></button>
      </div>

      <div class="conj-grid" id="conj-grid"></div>

      <button class="advanced-toggle" id="advanced-toggle" onclick="toggleAdvancedMoods()" hidden>
        <span id="advanced-toggle-label">More forms (Subjunctive, Jussive, Energetic)</span>
        <svg viewBox="0 0 24 24" width="16" height="16" id="advanced-chevron"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="mood-row" id="mood-row" hidden>
        <button class="chip small-chip" id="mood-indicative" onclick="setMood('indicative')">Indicative</button>
        <button class="chip small-chip" id="mood-subjunctive" onclick="setMood('subjunctive')">Subjunctive</button>
        <button class="chip small-chip" id="mood-jussive" onclick="setMood('jussive')">Jussive</button>
        <button class="chip small-chip" id="mood-energetic" onclick="setMood('energetic')">Energetic</button>
      </div>

      <p class="helper-note">Teal letters are the root; gold letters are the added prefix/suffix. "Commands" are really the imperative and jussive moods in disguise.</p>
    </section>

  </main>

  <!-- BOTTOM DOCK -->
  <nav class="bottom-dock">
    <button class="dock-btn" id="mode-learn" onclick="setMode('learn')">
      <svg viewBox="0 0 24 24" width="21" height="21"><path d="M12 3C9 7 7 10 7 13a5 5 0 0010 0c0-3-2-6-5-10z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>Learn</span>
    </button>
    <button class="dock-btn dock-practice" id="mode-practice" onclick="setMode('practice')">
      <svg viewBox="0 0 24 24" width="23" height="23"><path d="M12 3l2.4 5.8L20 11l-5.6 2.2L12 19l-2.4-5.8L4 11l5.6-2.2L12 3z" fill="currentColor"/></svg>
      <span>Practice</span>
      <span class="dock-badge" id="practice-badge"></span>
    </button>
    <button class="dock-btn" id="mode-conjugate" onclick="setMode('conjugate')">
      <svg viewBox="0 0 24 24" width="21" height="21"><path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Conjugate</span>
    </button>
  </nav>

</div>

<script src="app.js"></script>

</body>
</html>
