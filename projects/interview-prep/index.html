<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pattern Trace — LeetCode Pattern Recognition Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0F1C;
  --panel:#111A2B;
  --panel-2:#0E1524;
  --line:#223047;
  --line-soft:#1A2439;
  --text:#E7ECF5;
  --text-dim:#8B97B0;
  --text-faint:#5B667E;
  --accent:#F5B84A;
  --accent-dim:#8A6A2E;
  --good:#4ADE9E;
  --bad:#FB7185;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
  --sans: 'IBM Plex Sans', system-ui, sans-serif;
  --radius: 3px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";
  position:fixed; inset:0;
  background-image:
    linear-gradient(var(--line-soft) 1px, transparent 1px),
    linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
  background-size: 42px 42px;
  opacity:0.25;
  pointer-events:none;
  z-index:0;
}
#app{position:relative; z-index:1; display:flex; min-height:100vh;}

/* ---------- Sidebar ---------- */
.sidebar{
  width:220px; flex-shrink:0;
  background:var(--panel-2);
  border-right:1px solid var(--line);
  padding:24px 0;
  position:sticky; top:0; height:100vh;
  display:flex; flex-direction:column;
}
.brand{
  padding:0 20px 20px 20px;
  border-bottom:1px solid var(--line);
  margin-bottom:8px;
}
.brand-mark{
  font-family:var(--mono); font-size:13px; font-weight:600;
  letter-spacing:0.08em; color:var(--accent);
  display:flex; align-items:center; gap:8px;
}
.brand-mark .dot{width:7px;height:7px;border-radius:50%;background:var(--accent); box-shadow:0 0 8px var(--accent);}
.brand-sub{font-family:var(--mono); font-size:10px; color:var(--text-faint); margin-top:4px; letter-spacing:0.06em;}
.nav{padding:8px 12px; display:flex; flex-direction:column; gap:2px;}
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:10px 12px; border-radius:var(--radius);
  color:var(--text-dim); font-family:var(--mono); font-size:12.5px;
  letter-spacing:0.04em; cursor:pointer; border:1px solid transparent;
  background:none; text-align:left; width:100%;
}
.nav-item .idx{color:var(--text-faint); font-size:11px;}
.nav-item:hover{color:var(--text); background:var(--panel);}
.nav-item.active{color:var(--accent); background:var(--panel); border-color:var(--line);}
.nav-item.active .idx{color:var(--accent);}
.sidebar-foot{margin-top:auto; padding:16px 20px; border-top:1px solid var(--line);}
.sidebar-foot-label{font-family:var(--mono); font-size:10px; color:var(--text-faint); letter-spacing:0.05em; margin-bottom:8px;}
.mini-bar{height:4px; background:var(--panel); border-radius:2px; overflow:hidden; border:1px solid var(--line);}
.mini-bar-fill{height:100%; background:var(--accent);}
.sidebar-foot-val{font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-top:6px;}

/* ---------- Main ---------- */
.main{flex:1; min-width:0; padding:36px 44px 80px; max-width:980px;}
.view{display:none;}
.view.active{display:block;}
.page-eyebrow{font-family:var(--mono); font-size:11px; color:var(--accent); letter-spacing:0.1em; margin-bottom:8px;}
h1{font-family:var(--sans); font-size:26px; font-weight:600; margin:0 0 6px; letter-spacing:-0.01em;}
.page-desc{color:var(--text-dim); font-size:14px; margin:0 0 28px; max-width:620px; line-height:1.6;}

/* ---------- Trace stepper (signature element) ---------- */
.trace{display:flex; align-items:center; margin-bottom:32px; gap:0;}
.trace-node{
  width:26px; height:26px; border-radius:50%;
  border:1.5px solid var(--line); background:var(--panel);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-size:10.5px; color:var(--text-faint);
  flex-shrink:0; transition:all .35s ease; position:relative;
}
.trace-node.done{border-color:var(--accent); color:var(--accent); box-shadow:0 0 10px rgba(245,184,74,0.35);}
.trace-node.now{border-color:var(--accent); color:var(--accent); background:rgba(245,184,74,0.08);}
.trace-seg{flex:1; height:1.5px; background:var(--line); margin:0 2px; position:relative; overflow:hidden; min-width:12px;}
.trace-seg .fill{position:absolute; inset:0; background:var(--accent); width:0%; transition:width .5s ease; box-shadow:0 0 6px var(--accent);}
.trace-seg.done .fill{width:100%;}
.trace-labels{display:flex; justify-content:space-between; margin-top:6px; margin-bottom:28px; font-family:var(--mono); font-size:9.5px; color:var(--text-faint); letter-spacing:0.03em;}

/* ---------- Cards ---------- */
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:22px 24px; margin-bottom:18px;
}
.card-label{font-family:var(--mono); font-size:10.5px; color:var(--text-faint); letter-spacing:0.1em; text-transform:uppercase; margin-bottom:12px;}
.problem-title{font-size:19px; font-weight:600; margin:0 0 4px;}
.problem-meta{display:flex; gap:10px; align-items:center; margin-bottom:16px;}
.diff-badge{font-family:var(--mono); font-size:10.5px; padding:2px 8px; border-radius:2px; border:1px solid var(--line); letter-spacing:0.05em;}
.diff-Easy{color:var(--good); border-color:#1f4d3a;}
.diff-Medium{color:var(--accent); border-color:var(--accent-dim);}
.diff-Hard{color:var(--bad); border-color:#5c2a33;}
.problem-desc{font-size:14.5px; line-height:1.7; color:var(--text); white-space:pre-line;}
.examples{margin-top:14px; display:flex; flex-direction:column; gap:8px;}
.example{font-family:var(--mono); font-size:12.5px; background:var(--panel-2); border:1px solid var(--line-soft); border-radius:var(--radius); padding:10px 12px; color:var(--text-dim); line-height:1.6;}
.constraints{margin-top:14px; font-family:var(--mono); font-size:12px; color:var(--text-dim); line-height:1.8;}
.constraints li{margin-bottom:2px;}

/* ---------- Quiz form elements ---------- */
.step{margin-bottom:22px;}
.step-q{font-size:14px; font-weight:600; margin-bottom:12px;}
.options{display:flex; flex-direction:column; gap:8px;}
.opt{
  display:flex; align-items:center; gap:10px;
  padding:10px 14px; border:1px solid var(--line); border-radius:var(--radius);
  cursor:pointer; font-size:13.5px; color:var(--text-dim); background:var(--panel-2);
  transition:border-color .15s, color .15s, background .15s;
}
.opt:hover{border-color:var(--accent-dim); color:var(--text);}
.opt input{accent-color:var(--accent);}
.opt.selected{border-color:var(--accent); color:var(--text); background:rgba(245,184,74,0.06);}
.opt.reveal-correct{border-color:var(--good); background:rgba(74,222,158,0.06); color:var(--text);}
.opt.reveal-wrong{border-color:var(--bad); background:rgba(251,113,133,0.06); color:var(--text);}
.opt-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
@media (max-width:640px){.opt-grid{grid-template-columns:1fr;}}

.btn{
  font-family:var(--mono); font-size:12.5px; letter-spacing:0.04em;
  padding:11px 20px; border-radius:var(--radius); border:1px solid var(--accent);
  background:var(--accent); color:#1A1206; font-weight:600; cursor:pointer;
}
.btn:hover{filter:brightness(1.08);}
.btn.secondary{background:transparent; color:var(--text-dim); border-color:var(--line);}
.btn.secondary:hover{color:var(--text); border-color:var(--accent-dim);}
.btn:disabled{opacity:0.4; cursor:not-allowed;}
.btn-row{display:flex; gap:10px; margin-top:24px; flex-wrap:wrap;}

/* ---------- Review ---------- */
.review-row{display:grid; grid-template-columns:130px 1fr; gap:14px; padding:10px 0; border-bottom:1px solid var(--line-soft); font-size:13.5px;}
.review-row:last-child{border-bottom:none;}
.review-key{font-family:var(--mono); font-size:11px; color:var(--text-faint); letter-spacing:0.05em; padding-top:2px;}
.review-val{color:var(--text);}
.tag{display:inline-block; font-family:var(--mono); font-size:11px; padding:2px 8px; border-radius:2px; margin:2px 4px 2px 0; border:1px solid var(--line);}
.tag.good{color:var(--good); border-color:#1f4d3a; background:rgba(74,222,158,0.06);}
.tag.bad{color:var(--bad); border-color:#5c2a33; background:rgba(251,113,133,0.06);}
.explain-list{margin:0; padding-left:18px; font-size:13.5px; line-height:1.9; color:var(--text-dim);}
.explain-list li::marker{color:var(--accent); font-family:var(--mono);}
pre.template{
  background:var(--panel-2); border:1px solid var(--line-soft); border-radius:var(--radius);
  padding:16px; font-family:var(--mono); font-size:12.5px; line-height:1.7; color:var(--text);
  overflow-x:auto; margin:0;
}
.score-banner{display:flex; align-items:center; gap:14px; margin-bottom:18px;}
.score-num{font-family:var(--mono); font-size:30px; font-weight:700; color:var(--accent);}
.score-label{font-size:12.5px; color:var(--text-dim);}

/* ---------- Pattern library ---------- */
.lib-controls{display:flex; gap:10px; margin-bottom:20px;}
.search-input{
  flex:1; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:10px 14px; color:var(--text); font-family:var(--sans); font-size:13.5px;
}
.search-input:focus{outline:none; border-color:var(--accent-dim);}
.pattern-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px;}
.pattern-card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px 18px; cursor:pointer; transition:border-color .15s;
}
.pattern-card:hover{border-color:var(--accent-dim);}
.pattern-card-cat{font-family:var(--mono); font-size:9.5px; color:var(--text-faint); letter-spacing:0.08em; text-transform:uppercase;}
.pattern-card-name{font-size:15px; font-weight:600; margin:6px 0 6px;}
.pattern-card-desc{font-size:12.5px; color:var(--text-dim); line-height:1.5;}
.pattern-card-acc{margin-top:10px; font-family:var(--mono); font-size:11px; color:var(--text-faint);}

.back-link{font-family:var(--mono); font-size:11.5px; color:var(--text-dim); cursor:pointer; margin-bottom:18px; display:inline-block;}
.back-link:hover{color:var(--accent);}
.detail-section{margin-bottom:22px;}
.detail-label{font-family:var(--mono); font-size:11px; color:var(--text-faint); letter-spacing:0.08em; text-transform:uppercase; margin-bottom:10px;}
.chip-row{display:flex; flex-wrap:wrap; gap:6px;}
.chip{font-family:var(--mono); font-size:12px; padding:4px 10px; border:1px solid var(--line); border-radius:2px; color:var(--text-dim); background:var(--panel-2);}
.comparison-table{width:100%; border-collapse:collapse; font-size:13px;}
.comparison-table th{font-family:var(--mono); font-size:10.5px; color:var(--accent); text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); letter-spacing:0.04em;}
.comparison-table td{padding:8px 10px; border-bottom:1px solid var(--line-soft); color:var(--text-dim); line-height:1.5;}
.related-row{display:flex; gap:8px; flex-wrap:wrap;}
.related-chip{font-family:var(--mono); font-size:12px; padding:5px 12px; border:1px solid var(--line); border-radius:20px; color:var(--text-dim); cursor:pointer;}
.related-chip:hover{border-color:var(--accent); color:var(--accent);}
.recognition-q{
  font-style:italic; font-size:14px; color:var(--text); padding:14px 16px;
  border-left:2px solid var(--accent); background:var(--panel-2); line-height:1.6;
}

/* ---------- Progress ---------- */
.stat-row{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:24px;}
.stat-box{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px;}
.stat-num{font-family:var(--mono); font-size:24px; font-weight:700; color:var(--accent);}
.stat-lbl{font-family:var(--mono); font-size:10.5px; color:var(--text-faint); letter-spacing:0.05em; margin-top:4px;}
.perf-row{display:flex; align-items:center; gap:14px; padding:10px 0; border-bottom:1px solid var(--line-soft);}
.perf-name{width:170px; flex-shrink:0; font-size:13px;}
.perf-bar-track{flex:1; height:8px; background:var(--panel-2); border:1px solid var(--line); border-radius:4px; overflow:hidden;}
.perf-bar-fill{height:100%; background:var(--accent);}
.perf-bar-fill.weak{background:var(--bad);}
.perf-bar-fill.strong{background:var(--good);}
.perf-pct{width:44px; text-align:right; font-family:var(--mono); font-size:12px; color:var(--text-dim);}
.history-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line-soft); font-size:13px;}
.history-left{display:flex; align-items:center; gap:10px;}
.history-dot{width:7px; height:7px; border-radius:50%;}
.history-dot.ok{background:var(--good);}
.history-dot.no{background:var(--bad);}
.history-time{font-family:var(--mono); font-size:11px; color:var(--text-faint);}
.empty-state{padding:40px 20px; text-align:center; color:var(--text-faint); font-size:13.5px; border:1px dashed var(--line); border-radius:var(--radius);}

select.pattern-select{
  background:var(--panel); border:1px solid var(--line); color:var(--text);
  font-family:var(--mono); font-size:12.5px; padding:9px 12px; border-radius:var(--radius);
}

@media (max-width:800px){
  #app{flex-direction:column;}
  .sidebar{width:100%; height:auto; position:relative; flex-direction:row; overflow-x:auto; padding:12px;}
  .brand{display:none;}
  .nav{flex-direction:row; padding:0;}
  .sidebar-foot{display:none;}
  .main{padding:24px 18px 60px;}
  .stat-row{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="app">
  <div class="sidebar">
    <div class="brand">
      <div class="brand-mark"><span class="dot"></span>PATTERN // TRACE</div>
      <div class="brand-sub">recognition drills</div>
    </div>
    <div class="nav">
      <button class="nav-item active" data-view="practice"><span class="idx">01</span> Practice</button>
      <button class="nav-item" data-view="patterns"><span class="idx">02</span> Pattern Library</button>
      <button class="nav-item" data-view="progress"><span class="idx">03</span> Progress</button>
    </div>
    <div class="sidebar-foot">
      <div class="sidebar-foot-label">OVERALL ACCURACY</div>
      <div class="mini-bar"><div class="mini-bar-fill" id="sidebarBarFill" style="width:0%"></div></div>
      <div class="sidebar-foot-val" id="sidebarAccVal">no attempts yet</div>
    </div>
  </div>

  <div class="main">
    <!-- PRACTICE VIEW -->
    <div class="view active" id="view-practice"></div>
    <!-- PATTERNS VIEW -->
    <div class="view" id="view-patterns"></div>
    <!-- PROGRESS VIEW -->
    <div class="view" id="view-progress"></div>
  </div>
</div>

<script>
/* =========================================================
   DATA: PATTERNS
========================================================= */
const PATTERNS = [
  {
    id:"hash-map", name:"Hash Map / Hash Set", category:"Arrays & Strings",
    description:"A technique for trading space for time by remembering what you've already seen so a later lookup is O(1) instead of a rescan.",
    clues:["need fast lookup","have I seen this before","complement or pair exists","count frequency","duplicate detection","large input size"],
    dataStructures:["Hash Map","Hash Set"],
    complexity:{time:"O(n)", space:"O(n)"},
    templates:[{name:"Frequency / Lookup Map", code:
`const seen = new Map();

for (const x of arr) {
    const complement = target - x;
    if (seen.has(complement)) {
        // found a match — use seen.get(complement)
    }
    seen.set(x, /* index or count */ 1);
}`}],
    recognitionQuestion:"Am I repeatedly asking 'have I seen this value before' or 'does its complement exist'?",
    relatedPatterns:["prefix-sum","sliding-window"],
    comparisons:[{with:"prefix-sum", rows:[
      ["Tracks individual values or counts","Tracks running totals over a range"],
      ["Answers 'have I seen X'","Answers 'what is the sum of this range'"]
    ]}]
  },
  {
    id:"two-pointers", name:"Two Pointers", category:"Arrays & Strings",
    description:"Two indices move through a (usually sorted) structure toward or away from each other, avoiding a nested loop.",
    clues:["sorted input","pair with target sum","palindrome check","remove duplicates in place","compare from both ends"],
    dataStructures:["Array"],
    complexity:{time:"O(n)", space:"O(1)"},
    templates:[{name:"Converging Pointers", code:
`let left = 0;
let right = nums.length - 1;

while (left < right) {
    const sum = nums[left] + nums[right];
    if (sum === target) {
        // found pair
        break;
    } else if (sum < target) {
        left++;
    } else {
        right--;
    }
}`}],
    recognitionQuestion:"Is the input sorted (or sortable) and am I comparing elements from opposite ends or at fixed offsets?",
    relatedPatterns:["sliding-window","binary-search"],
    comparisons:[{with:"sliding-window", rows:[
      ["Usually focuses on relationships between positions","Usually focuses on a contiguous range"],
      ["Often moves pointers based on comparisons","Often maintains a window condition"],
      ["Common with sorted arrays, pairs, palindromes","Common with subarrays / substrings"]
    ]}]
  },
  {
    id:"sliding-window", name:"Sliding Window", category:"Arrays & Strings",
    description:"A technique for efficiently examining a contiguous region of an array or string without repeatedly reprocessing the same elements.",
    clues:["contiguous subarray","substring","longest or shortest","maximum or minimum over a range","at most k","at least k","fixed-size window","large input size"],
    dataStructures:["Array","Hash Map","Hash Set","Deque"],
    complexity:{time:"O(n)", space:"O(1) to O(k)"},
    templates:[{name:"Variable Sliding Window", code:
`let left = 0;
let result = 0;

for (let right = 0; right < nums.length; right++) {
    // add nums[right] to the window

    while (/* window is invalid */ false) {
        // remove nums[left] from the window
        left++;
    }
    // update result using the current window [left, right]
}`},
    {name:"Fixed Sliding Window", code:
`let windowSum = 0;

for (let i = 0; i < k; i++) windowSum += nums[i];
let best = windowSum;

for (let i = k; i < nums.length; i++) {
    windowSum += nums[i] - nums[i - k];
    best = Math.max(best, windowSum);
}`}],
    recognitionQuestion:"Am I repeatedly examining a contiguous range where the left and right boundaries can move without restarting the entire calculation?",
    relatedPatterns:["two-pointers","prefix-sum"],
    comparisons:[{with:"two-pointers", rows:[
      ["Usually focuses on a contiguous range","Usually focuses on relationships between positions"],
      ["Often maintains a window condition","Often moves pointers based on comparisons"],
      ["Common with subarrays / substrings","Common with sorted arrays, pairs, palindromes"]
    ]}]
  },
  {
    id:"prefix-sum", name:"Prefix Sum", category:"Arrays & Strings",
    description:"Precompute running totals so any range sum can be answered in O(1) instead of rescanning the range each time.",
    clues:["range sum query","subarray sum equals k","cumulative total","many repeated range queries"],
    dataStructures:["Array","Hash Map"],
    complexity:{time:"O(n)", space:"O(n)"},
    templates:[{name:"Prefix Sum + Hash Map", code:
`const seenSums = new Map([[0, 1]]);
let prefixSum = 0;
let count = 0;

for (const x of nums) {
    prefixSum += x;
    const needed = prefixSum - target;
    count += seenSums.get(needed) || 0;
    seenSums.set(prefixSum, (seenSums.get(prefixSum) || 0) + 1);
}`}],
    recognitionQuestion:"Do I need the sum of many different ranges, especially repeatedly, rather than just one pass?",
    relatedPatterns:["hash-map","sliding-window"],
    comparisons:[]
  },
  {
    id:"binary-search", name:"Binary Search", category:"Arrays & Strings",
    description:"Repeatedly halve a sorted search space (or a monotonic answer space) to find a target or boundary in logarithmic time.",
    clues:["sorted input","find exact value","find boundary or threshold","minimize the maximum","search space is monotonic","logarithmic requirement"],
    dataStructures:["Array"],
    complexity:{time:"O(log n)", space:"O(1)"},
    templates:[{name:"Boundary Binary Search", code:
`let lo = 0, hi = nums.length;

while (lo < hi) {
    const mid = Math.floor((lo + hi) / 2);
    if (/* condition(mid) is true */ false) {
        hi = mid;
    } else {
        lo = mid + 1;
    }
}
// lo is the boundary`}],
    recognitionQuestion:"Is the search space sorted or monotonic, so that testing the middle tells me which half to discard?",
    relatedPatterns:["two-pointers"],
    comparisons:[]
  },
  {
    id:"monotonic-stack", name:"Monotonic Stack", category:"Arrays & Strings",
    description:"A stack kept in increasing or decreasing order so each element finds its 'next greater/smaller' neighbor in amortized O(1).",
    clues:["next greater element","next smaller element","daily temperatures style","largest rectangle","span until a bigger value"],
    dataStructures:["Stack"],
    complexity:{time:"O(n)", space:"O(n)"},
    templates:[{name:"Next Greater Element", code:
`const stack = []; // stores indices
const result = new Array(nums.length).fill(-1);

for (let i = 0; i < nums.length; i++) {
    while (stack.length && nums[i] > nums[stack[stack.length - 1]]) {
        const idx = stack.pop();
        result[idx] = nums[i];
    }
    stack.push(i);
}`}],
    recognitionQuestion:"Am I looking for the next element that is greater/smaller than the current one, for every element?",
    relatedPatterns:["heap"],
    comparisons:[]
  },
  {
    id:"dfs", name:"DFS (Depth-First Search)", category:"Trees & Graphs",
    description:"Explore as far as possible down one branch before backtracking — natural for trees, connected components, and path existence.",
    clues:["tree structure","explore all paths","connected components","path from root to leaf","recursion feels natural"],
    dataStructures:["Stack","Tree","Graph"],
    complexity:{time:"O(V + E)", space:"O(H)"},

function loadAttempts(){
  try{

    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveAttempt(attempt){
  const all = loadAttempts();
  all.push(attempt);
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(all)); }catch(e){}
}

function pickRandomProblem(filterPatternId){
  const pool = filterPatternId ? PROBLEMS.filter(p=>p.primaryPattern===filterPatternId) : PROBLEMS;
  if(!pool.length) return null;
  return pool[Math.floor(Math.random()*pool.length)];
}

function computePatternStats(){
  const attempts = loadAttempts();
  const stats = {};
  PATTERNS.forEach(p => stats[p.id] = {attempts:0, correct:0});
  attempts.forEach(a => {
    if(!stats[a.pattern]) stats[a.pattern] = {attempts:0, correct:0};
    stats[a.pattern].attempts++;
    if(a.patternCorrect) stats[a.pattern].correct++;
  });
  return stats;
}

function overallAccuracy(){
  const attempts = loadAttempts();
  if(!attempts.length) return null;
  const correct = attempts.filter(a=>a.patternCorrect).length;
  return Math.round((correct/attempts.length)*100);
}

  const stats = computePatternStats();
  let weakest = null, weakestAcc = 101;
  Object.entries(stats).forEach(([id, s]) => {
    if(s.attempts >= 1){
      const acc = (s.correct/s.attempts)*100;
      if(acc < weakestAcc){ weakestAcc = acc; weakest = id; }
    }
  });
  return weakest;
}

/* =========================================================
   RENDER: NAV
========================================================= */
function setView(view){
  currentView = view;
  document.querySelectorAll(".nav-item").forEach(el=>{
    el.classList.toggle("active", el.dataset.view===view);
  });
  document.querySelectorAll(".view").forEach(el=>el.classList.remove("active"));
  document.getElementById("view-"+view).classList.add("active");
  if(view==="practice") renderPractice();
  if(view==="patterns") renderPatternLibrary();
  if(view==="progress") renderProgress();
  renderSidebarFoot();
}
document.querySelectorAll(".nav-item").forEach(el=>{
  el.addEventListener("click", ()=> setView(el.dataset.view));
});

function renderSidebarFoot(){
  const acc = overallAccuracy();
  document.getElementById("sidebarBarFill").style.width = (acc===null?0:acc)+"%";
  document.getElementById("sidebarAccVal").textContent = acc===null ? "no attempts yet" : acc+"% across "+loadAttempts().length+" attempts";
}

/* =========================================================
   RENDER: PRACTICE
========================================================= */
function startNewProblem(problem){
  currentProblem = problem;
  quizState = { clues:new Set(), pattern:null, ds:new Set(), complexity:null, complexityDone:false, submitted:false };
  renderPractice();
}

function stepDone(n){
  if(!quizState) return false;
  if(n===2) return quizState.clues.size>0;
  if(n===3) return !!quizState.pattern;
  if(n===4) return quizState.ds.size>0;
  if(n===5) return !!quizState.complexity || quizState.complexityDone;
  if(n===6) return quizState.submitted;
  return true;
}

function renderTrace(activeStep){
  const labels = ["Problem","Clues","Pattern","D. Struct.","Complexity","Review"];
  let nodes = "";
  let labelsHtml = "";
  for(let i=1;i<=6;i++){
    const done = stepDone(i) && i!==activeStep;
    const now = i===activeStep;
    nodes += `<div class="trace-node ${done?'done':''} ${now?'now':''}">${i}</div>`;
    if(i<6){
      const segDone = stepDone(i);
      nodes += `<div class="trace-seg ${segDone?'done':''}"><div class="fill"></div></div>`;
    }
    labelsHtml += `<span>${labels[i-1]}</span>`;
  }
  return `<div class="trace">${nodes}</div><div class="trace-labels">${labelsHtml}</div>`;
}

function renderPractice(){
  const el = document.getElementById("view-practice");
  if(!currentProblem){
    el.innerHTML = `
      <div class="page-eyebrow">01 / PRACTICE</div>
      <h1>Pattern Recognition Session</h1>
      <p class="page-desc">See a problem, name the clues, name the pattern, name the data structure and target complexity — before you see the answer. Then review why.</p>
      <div class="card">
        <div class="card-label">Start a session</div>
        <div class="btn-row" style="margin-top:0;">
          <button class="btn" id="btnRandom">Random Practice</button>
          <button class="btn secondary" id="btnWeak">Weak Areas</button>
        </div>
        <div style="margin-top:18px; display:flex; align-items:center; gap:10px;">
          <label style="font-family:var(--mono); font-size:11.5px; color:var(--text-faint);">PRACTICE A SPECIFIC PATTERN</label>
          <select class="pattern-select" id="patternPicker">
            <option value="">Choose pattern…</option>
            ${PATTERNS.map(p=>`<option value="${p.id}">${p.name}</option>`).join("")}
          </select>
          <button class="btn secondary" id="btnPatternPractice">Go</button>
        </div>
      </div>
    `;
    document.getElementById("btnRandom").onclick = ()=> startNewProblem(pickRandomProblem());
    document.getElementById("btnWeak").onclick = ()=>{
      const w = weakestPattern();
      startNewProblem(pickRandomProblem(w) || pickRandomProblem());
    };
    document.getElementById("btnPatternPractice").onclick = ()=>{
      const val = document.getElementById("patternPicker").value;
      if(val) startNewProblem(pickRandomProblem(val));
    };
    return;
  }

  const p = currentProblem;
  const activeStep = quizState.submitted ? 6 : (quizState.complexity||quizState.complexityDone ? 6 : (quizState.ds.size>0 ? 5 : (quizState.pattern ? 4 : (quizState.clues.size>0 ? 3 : 2))));

  let html = `
    <div class="page-eyebrow">01 / PRACTICE</div>
    <h1>${p.title}</h1>
    <p class="page-desc">Work through each step before submitting. Nothing is revealed until you review.</p>
    ${renderTrace(quizState.submitted?6:activeStep)}

    <div class="card">
      <div class="card-label">Problem</div>
      <div class="problem-meta"><span class="diff-badge diff-${p.difficulty}">${p.difficulty}</span></div>
      <div class="problem-desc">${p.description}</div>
      <div class="examples">
        ${p.examples.map(ex=>`<div class="example">Input: ${ex.input}<br>Output: ${ex.output}</div>`).join("")}
      </div>
      <ul class="constraints">${p.constraints.map(c=>`<li>${c}</li>`).join("")}</ul>
    </div>
  `;

  if(!quizState.submitted){
    // Step 2: clues
    const clueOptions = getClueOptions(p);
    html += `
    <div class="card">
      <div class="step">
        <div class="step-q">Which clues stand out?</div>
        <div class="opt-grid" id="clueOptions">
          ${clueOptions.map((c,i)=>`
            <label class="opt ${quizState.clues.has(c)?'selected':''}" data-clue="${escapeAttr(c)}">
              <input type="checkbox" ${quizState.clues.has(c)?'checked':''}> ${c}
            </label>`).join("")}
        </div>
      </div>

      <div class="step">
        <div class="step-q">What pattern is this?</div>
        <div class="opt-grid">
          ${PATTERNS.map(pt=>`
            <label class="opt ${quizState.pattern===pt.id?'selected':''}" data-pattern="${pt.id}">
              <input type="radio" name="pattern" ${quizState.pattern===pt.id?'checked':''}> ${pt.name}
            </label>`).join("")}
        </div>
      </div>

      <div class="step">
        <div class="step-q">Likely data structure(s)</div>
        <div class="opt-grid">
          ${DS_POOL.map(d=>`
            <label class="opt ${quizState.ds.has(d)?'selected':''}" data-ds="${escapeAttr(d)}">
              <input type="checkbox" ${quizState.ds.has(d)?'checked':''}> ${d}
            </label>`).join("")}
        </div>
      </div>

      <div class="step">
        <div class="step-q">Target time complexity</div>
        <div class="opt-grid">
          ${COMPLEXITY_OPTIONS.map(c=>`
            <label class="opt ${quizState.complexity===c?'selected':''}" data-complexity="${escapeAttr(c)}">
              <input type="radio" name="complexity" ${quizState.complexity===c?'checked':''}> ${c}
            </label>`).join("")}
        </div>
      </div>

      <div class="btn-row">
        <button class="btn" id="btnSubmit" ${(!quizState.pattern)?'disabled':''}>Submit & Review</button>
        <button class="btn secondary" id="btnAbandon">Choose a different problem</button>
      </div>
    </div>
    `;
  } else {
    html += renderReview(p);
    html += `
    <div class="btn-row">
      <button class="btn" id="btnNext">Next Problem</button>
      <button class="btn secondary" id="btnMenu">Back to Practice Menu</button>
    </div>`;
  }

  el.innerHTML = html;
  wirePracticeEvents(p);
}

function getClueOptions(problem){
  const correct = problem.recognitionClues;
  const distractorsPool = CLUE_POOL.filter(c=>!correct.includes(c));
  const shuffledDistractors = shuffle([...distractorsPool]).slice(0, Math.max(3, 7-correct.length));
  return shuffle([...correct, ...shuffledDistractors]);
}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}
function escapeAttr(s){ return s.replace(/"/g,'&quot;'); }

function wirePracticeEvents(p){
  document.querySelectorAll("[data-clue]").forEach(el=>{
    el.onclick = (e)=>{
      e.preventDefault();
      const c = el.dataset.clue;
      if(quizState.clues.has(c)) quizState.clues.delete(c); else quizState.clues.add(c);
      renderPractice();
    };
  });
  document.querySelectorAll("[data-pattern]").forEach(el=>{
    el.onclick = (e)=>{
      e.preventDefault();
      quizState.pattern = el.dataset.pattern;
      renderPractice();
    };
  });
  document.querySelectorAll("[data-ds]").forEach(el=>{
    el.onclick = (e)=>{
      e.preventDefault();
      const d = el.dataset.ds;
      if(quizState.ds.has(d)) quizState.ds.delete(d); else quizState.ds.add(d);
      renderPractice();
    };
  });
  document.querySelectorAll("[data-complexity]").forEach(el=>{
    el.onclick = (e)=>{
      e.preventDefault();
      quizState.complexity = el.dataset.complexity;
      renderPractice();
    };
  });
  const submitBtn = document.getElementById("btnSubmit");
  if(submitBtn) submitBtn.onclick = ()=> submitQuiz(p);
  const abandonBtn = document.getElementById("btnAbandon");
  if(abandonBtn) abandonBtn.onclick = ()=>{ currentProblem=null; quizState=null; renderPractice(); };
  const nextBtn = document.getElementById("btnNext");
  if(nextBtn) nextBtn.onclick = ()=> startNewProblem(pickRandomProblem());
  const menuBtn = document.getElementById("btnMenu");
  if(menuBtn) menuBtn.onclick = ()=>{ currentProblem=null; quizState=null; renderPractice(); };
}

function submitQuiz(p){
  const patternCorrect = quizState.pattern === p.primaryPattern;
  const dsCorrectSet = new Set(p.dataStructures);
  const dsSelected = quizState.ds;
  const dsCorrect = dsSelected.size===dsCorrectSet.size && [...dsSelected].every(d=>dsCorrectSet.has(d));
  const complexityCorrect = quizState.complexity === p.targetComplexity.time;
  const cluesCorrectSet = new Set(p.recognitionClues);
  const cluesCorrect = [...quizState.clues].filter(c=>cluesCorrectSet.has(c)).length;

  quizState.submitted = true;
  quizState.result = { patternCorrect, dsCorrect, complexityCorrect, cluesCorrect, cluesTotal:p.recognitionClues.length };

  saveAttempt({
    problemId:p.id,
    pattern:p.primaryPattern,
    patternCorrect,
    dsCorrect,
    complexityCorrect,
    timestamp: Date.now()
  });

  renderPractice();
}

function renderReview(p){
  const r = quizState.result;
  const scoreParts = [r.patternCorrect, r.dsCorrect, r.complexityCorrect];
  const scoreCount = scoreParts.filter(Boolean).length;

  const pattern = PATTERNS.find(x=>x.id===p.primaryPattern);
  const tmpl = TEMPLATE_LOOKUP[p.template];

  return `
    <div class="card">
      <div class="card-label">Review</div>
      <div class="score-banner">
        <div class="score-num">${scoreCount}/3</div>
        <div class="score-label">core answers correct<br>(pattern, data structure, complexity)</div>
      </div>

      <div class="review-row">
        <div class="review-key">CLUES</div>
        <div class="review-val">
          You selected ${r.cluesCorrect} of ${r.cluesTotal} key clues.<br>
          ${p.recognitionClues.map(c=>`<span class="tag ${quizState.clues.has(c)?'good':'bad'}">${c}</span>`).join("")}
        </div>
      </div>
      <div class="review-row">
        <div class="review-key">PATTERN</div>
        <div class="review-val">
          <span class="tag ${r.patternCorrect?'good':'bad'}">You said: ${PATTERNS.find(x=>x.id===quizState.pattern)?.name || "—"}</span>
          ${!r.patternCorrect?`<span class="tag good">Correct: ${pattern.name}</span>`:''}
        </div>
      </div>
      <div class="review-row">
        <div class="review-key">DATA STRUCTURE</div>
        <div class="review-val">
          ${p.dataStructures.map(d=>`<span class="tag ${quizState.ds.has(d)?'good':'bad'}">${d}</span>`).join("")}
          ${[...quizState.ds].filter(d=>!p.dataStructures.includes(d)).map(d=>`<span class="tag bad">${d} (not needed)</span>`).join("")}
        </div>
      </div>
      <div class="review-row">
        <div class="review-key">COMPLEXITY</div>
        <div class="review-val">
          <span class="tag ${r.complexityCorrect?'good':'bad'}">You said: ${quizState.complexity || '—'}</span>
          ${!r.complexityCorrect?`<span class="tag good">Target: ${p.targetComplexity.time} time, ${p.targetComplexity.space} space</span>`:`<span class="tag good">Space: ${p.targetComplexity.space}</span>`}
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-label">Why ${pattern.name}?</div>
      <ol class="explain-list">
        ${p.explanation.map(e=>`<li>${e}</li>`).join("")}
      </ol>
    </div>

    <div class="card">
      <div class="card-label">Generalized Template — ${tmpl.name}</div>
      <pre class="template">${tmpl.code}</pre>
    </div>
  `;
}

/* =========================================================
   RENDER: PATTERN LIBRARY
========================================================= */
let libraryFilter = "";
let selectedPatternId = null;

function renderPatternLibrary(){
  const el = document.getElementById("view-patterns");
  if(selectedPatternId){
    renderPatternDetail(selectedPatternId);
    return;
  }
  const stats = computePatternStats();
  const filtered = PATTERNS.filter(p =>
    !libraryFilter ||
    p.name.toLowerCase().includes(libraryFilter.toLowerCase()) ||
    p.category.toLowerCase().includes(libraryFilter.toLowerCase()) ||
    p.clues.some(c=>c.toLowerCase().includes(libraryFilter.toLowerCase()))
  );

  el.innerHTML = `
    <div class="page-eyebrow">02 / PATTERN LIBRARY</div>
    <h1>Reference Patterns</h1>
    <p class="page-desc">One canonical page per pattern — clues, data structures, complexity, and a template. Built for recognition, not full tutorials.</p>
    <div class="lib-controls">
      <input class="search-input" id="libSearch" placeholder="Search patterns, categories, or clues…" value="${libraryFilter}">
    </div>
    <div class="pattern-grid">
      ${filtered.map(p=>{
        const s = stats[p.id];
        const acc = s.attempts ? Math.round((s.correct/s.attempts)*100)+"%" : "not attempted";
        return `
        <div class="pattern-card" data-pid="${p.id}">
          <div class="pattern-card-cat">${p.category}</div>
          <div class="pattern-card-name">${p.name}</div>
          <div class="pattern-card-desc">${p.description}</div>
          <div class="pattern-card-acc">RECOGNITION: ${acc}</div>
        </div>`;
      }).join("") || `<div class="empty-state">No patterns match "${libraryFilter}".</div>`}
    </div>
  `;
  document.getElementById("libSearch").oninput = (e)=>{ libraryFilter = e.target.value; renderPatternLibrary(); };
  document.querySelectorAll("[data-pid]").forEach(el2=>{
    el2.onclick = ()=>{ selectedPatternId = el2.dataset.pid; renderPatternLibrary(); };
  });
}

function renderPatternDetail(pid){

  const stats = computePatternStats()[pid];
  const acc = stats.attempts ? Math.round((stats.correct/stats.attempts)*100)+"%" : "not attempted yet";

  el.innerHTML = `
    <span class="back-link" id="backToLib">← Back to library</span>
    <div class="page-eyebrow">${p.category.toUpperCase()}</div>
    <h1>${p.name}</h1>
    <p class="page-desc">${p.description}</p>

    <div class="detail-section">
      <div class="detail-label">Strong Clues</div>
      <div class="chip-row">${p.clues.map(c=>`<span class="chip">${c}</span>`).join("")}</div>
    </div>

    <div class="detail-section">
      <div class="detail-label">Typical Data Structures</div>
      <div class="chip-row">${p.dataStructures.map(d=>`<span class="chip">${d}</span>`).join("")}</div>
    </div>

    <div class="detail-section">
      <div class="detail-label">Typical Complexity</div>
      <div class="chip-row"><span class="chip">Time: ${p.complexity.time}</span><span class="chip">Space: ${p.complexity.space}</span></div>
    </div>

    <div class="detail-section">
      <div class="detail-label">Recognition Question</div>
      <div class="recognition-q">"${p.recognitionQuestion}"</div>
    </div>

    <div class="detail-section">
      <div class="detail-label">General Template${p.templates.length>1?'s':''}</div>
      ${p.templates.map(t=>`<div style="margin-bottom:12px;"><div style="font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-bottom:6px;">${t.name}</div><pre class="template">${t.code}</pre></div>`).join("")}
    </div>

    ${p.comparisons.length ? `
    <div class="detail-section">
      <div class="detail-label">Comparison</div>
      ${p.comparisons.map(c=>{
        const other = PATTERNS.find(x=>x.id===c.with);
        return `
        <div style="margin-bottom:14px;">
          <div style="font-size:13px; margin-bottom:8px; color:var(--text-dim);">${p.name} vs ${other.name}</div>
          <table class="comparison-table">
            <tr><th>${p.name}</th><th>${other.name}</th></tr>
            ${c.rows.map(row=>`<tr><td>${row[0]}</td><td>${row[1]}</td></tr>`).join("")}
          </table>
        </div>`;
      }).join("")}
    </div>` : ''}

    <div class="detail-section">
      <div class="detail-label">Similar Patterns</div>
      <div class="related-row">
        ${p.relatedPatterns.map(rid=>{
          const rp = PATTERNS.find(x=>x.id===rid);
          return rp ? `<span class="related-chip" data-pid="${rp.id}">${rp.name}</span>` : '';

    </div>
  `;
  document.getElementById("backToLib").onclick = ()=>{ selectedPatternId=null; renderPatternLibrary(); };
  document.querySelectorAll(".related-chip").forEach(el2=>{
    el2.onclick = ()=>{ selectedPatternId = el2.dataset.pid; renderPatternLibrary(); };

/* =========================================================
   RENDER: PROGRESS
========================================================= */
function renderProgress(){
  const el = document.getElementById("view-progress");
  const attempts = loadAttempts();
  const stats = computePatternStats();
  const totalAttempts = attempts.length;
  const totalCorrect = attempts.filter(a=>a.patternCorrect).length;
  const overallAcc = totalAttempts ? Math.round((totalCorrect/totalAttempts)*100) : 0;
  const patternsAttempted = Object.values(stats).filter(s=>s.attempts>0).length;

  const sortedPatterns = PATTERNS
    .map(p=>({p, s:stats[p.id]}))
    .filter(x=>x.s.attempts>0)
    .sort((a,b)=> (b.s.correct/b.s.attempts) - (a.s.correct/a.s.attempts));

  el.innerHTML = `
    <div class="page-eyebrow">03 / PROGRESS</div>
    <h1>Recognition Performance</h1>
    <p class="page-desc">Tracks whether you named the right pattern — the core recognition skill this app trains toward.</p>

    <div class="stat-row">
      <div class="stat-box"><div class="stat-num">${totalAttempts}</div><div class="stat-lbl">TOTAL ATTEMPTS</div></div>
      <div class="stat-box"><div class="stat-num">${totalAttempts?overallAcc+'%':'—'}</div><div class="stat-lbl">PATTERN ACCURACY</div></div>
      <div class="stat-box"><div class="stat-num">${patternsAttempted}/${PATTERNS.length}</div><div class="stat-lbl">PATTERNS TOUCHED</div></div>
    </div>

    <div class="card">
      <div class="card-label">Your Pattern Performance</div>
      ${sortedPatterns.length ? sortedPatterns.map(({p,s})=>{
        const acc = Math.round((s.correct/s.attempts)*100);
        const cls = acc<60?'weak':(acc>=85?'strong':'');
        return `
        <div class="perf-row">
          <div class="perf-name">${p.name}</div>
          <div class="perf-bar-track"><div class="perf-bar-fill ${cls}" style="width:${acc}%"></div></div>
          <div class="perf-pct">${acc}%</div>
        </div>`;
      }).join("") : `<div class="empty-state">No attempts yet. Head to Practice to start a session.</div>`}
    </div>

    ${sortedPatterns.length ? `
    <div class="card">
      <div class="card-label">Weak Areas</div>
      <p style="font-size:13px; color:var(--text-dim); margin:0 0 14px;">Patterns below 60% recognition accuracy — good candidates for your next session.</p>
      <div class="btn-row" style="margin-top:0;">
        <button class="btn" id="btnPracticeWeak">Practice Weakest Pattern</button>
      </div>
    </div>` : ''}

    <div class="card">
      <div class="card-label">Attempt History</div>
      ${attempts.length ? [...attempts].reverse().slice(0,25).map(a=>{
        const p = PROBLEMS.find(x=>x.id===a.problemId);
        const pat = PATTERNS.find(x=>x.id===a.pattern);
        const d = new Date(a.timestamp);
        return `
        <div class="history-row">
          <div class="history-left">
            <span class="history-dot ${a.patternCorrect?'ok':'no'}"></span>
            <span>${p?p.title:'Unknown problem'}</span>
            <span style="color:var(--text-faint);">— ${pat?pat.name:a.pattern}</span>
          </div>
          <span class="history-time">${d.toLocaleDateString()} ${d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
        </div>`;
      }).join("") : `<div class="empty-state">Nothing here yet.</div>`}
    </div>
  `;

  const weakBtn = document.getElementById("btnPracticeWeak");
  if(weakBtn) weakBtn.onclick = ()=>{
    const w = weakestPattern();
    currentProblem = null; quizState = null;
    setView("practice");
    startNewProblem(pickRandomProblem(w) || pickRandomProblem());
  };
}

/* =========================================================
   INIT
========================================================= */
renderPractice();
renderPatternLibrary();
renderProgress();
renderSidebarFoot();
</script>
