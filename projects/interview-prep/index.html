<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pattern Trace — LeetCode Pattern Recognition Trainer</title>
<meta name="description" content="Pattern Trace: drill LeetCode-style problems by naming the clues, pattern, data structure, and target complexity, then step through interactive algorithm diagrams.">
<meta name="theme-color" content="#0A0F1C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0F1C;
  --panel:#111A2B;
  --panel-2:#0E1524;
  --line:#223047;
  --line-soft:#1A2439;
  --text:#E7ECF5;
  --text-dim:#8B97B0;
  --text-faint:#5B667E;
  --accent:#F5B84A;
  --accent-dim:#8A6A2E;
  --good:#4ADE9E;
  --bad:#FB7185;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
  --sans: 'IBM Plex Sans', system-ui, sans-serif;
  --radius: 3px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";
  position:fixed; inset:0;
  background-image:
    linear-gradient(var(--line-soft) 1px, transparent 1px),
    linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
  background-size: 42px 42px;
  opacity:0.25;
  pointer-events:none;
  z-index:0;
}
#app{position:relative; z-index:1; display:flex; min-height:100vh;}

/* ---------- Sidebar ---------- */
.sidebar{
  width:220px; flex-shrink:0;
  background:var(--panel-2);
  border-right:1px solid var(--line);
  padding:24px 0;
  position:sticky; top:0; height:100vh;
  display:flex; flex-direction:column;
}
.brand{
  padding:0 20px 20px 20px;
  border-bottom:1px solid var(--line);
  margin-bottom:8px;
}
.brand-mark{
  font-family:var(--mono); font-size:13px; font-weight:600;
  letter-spacing:0.08em; color:var(--accent);
  display:flex; align-items:center; gap:8px;
}
.brand-mark .dot{width:7px;height:7px;border-radius:50%;background:var(--accent); box-shadow:0 0 8px var(--accent);}
.brand-sub{font-family:var(--mono); font-size:10px; color:var(--text-faint); margin-top:4px; letter-spacing:0.06em;}
.nav{padding:8px 12px; display:flex; flex-direction:column; gap:2px;}
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:10px 12px; border-radius:var(--radius);
  color:var(--text-dim); font-family:var(--mono); font-size:12.5px;
  letter-spacing:0.04em; cursor:pointer; border:1px solid transparent;
  background:none; text-align:left; width:100%;
}
.nav-item .idx{color:var(--text-faint); font-size:11px;}
.nav-item:hover{color:var(--text); background:var(--panel);}
.nav-item.active{color:var(--accent); background:var(--panel); border-color:var(--line);}
.nav-item.active .idx{color:var(--accent);}
.sidebar-foot{margin-top:auto; padding:16px 20px; border-top:1px solid var(--line);}
.sidebar-foot-label{font-family:var(--mono); font-size:10px; color:var(--text-faint); letter-spacing:0.05em; margin-bottom:8px;}
.mini-bar{height:4px; background:var(--panel); border-radius:2px; overflow:hidden; border:1px solid var(--line);}
.mini-bar-fill{height:100%; background:var(--accent);}
.sidebar-foot-val{font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-top:6px;}

/* ---------- Main ---------- */
.main{flex:1; min-width:0; padding:36px 44px 80px; max-width:980px;}
.view{display:none;}
.view.active{display:block;}
.page-eyebrow{font-family:var(--mono); font-size:11px; color:var(--accent); letter-spacing:0.1em; margin-bottom:8px;}
h1{font-family:var(--sans); font-size:26px; font-weight:600; margin:0 0 6px; letter-spacing:-0.01em;}
.page-desc{color:var(--text-dim); font-size:14px; margin:0 0 28px; max-width:620px; line-height:1.6;}

/* ---------- Trace stepper (signature element) ---------- */
.trace{display:flex; align-items:center; margin-bottom:32px; gap:0;}
.trace-node{
  width:26px; height:26px; border-radius:50%;
  border:1.5px solid var(--line); background:var(--panel);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-size:10.5px; color:var(--text-faint);
  flex-shrink:0; transition:all .35s ease; position:relative;
}
.trace-node.done{border-color:var(--accent); color:var(--accent); box-shadow:0 0 10px rgba(245,184,74,0.35);}
.trace-node.now{border-color:var(--accent); color:var(--accent); background:rgba(245,184,74,0.08);}
.trace-seg{flex:1; height:1.5px; background:var(--line); margin:0 2px; position:relative; overflow:hidden; min-width:12px;}
.trace-seg .fill{position:absolute; inset:0; background:var(--accent); width:0%; transition:width .5s ease; box-shadow:0 0 6px var(--accent);}
.trace-seg.done .fill{width:100%;}
.trace-labels{display:flex; justify-content:space-between; margin-top:6px; margin-bottom:28px; font-family:var(--mono); font-size:9.5px; color:var(--text-faint); letter-spacing:0.03em;}

/* ---------- Cards ---------- */
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:22px 24px; margin-bottom:18px;
}
.card-label{font-family:var(--mono); font-size:10.5px; color:var(--text-faint); letter-spacing:0.1em; text-transform:uppercase; margin-bottom:12px;}
.problem-title{font-size:19px; font-weight:600; margin:0 0 4px;}
.problem-meta{display:flex; gap:10px; align-items:center; margin-bottom:16px;}
.diff-badge{font-family:var(--mono); font-size:10.5px; padding:2px 8px; border-radius:2px; border:1px solid var(--line); letter-spacing:0.05em;}
.diff-Easy{color:var(--good); border-color:#1f4d3a;}
.diff-Medium{color:var(--accent); border-color:var(--accent-dim);}
.diff-Hard{color:var(--bad); border-color:#5c2a33;}
.problem-desc{font-size:14.5px; line-height:1.7; color:var(--text); white-space:pre-line;}
.examples{margin-top:14px; display:flex; flex-direction:column; gap:8px;}
.example{font-family:var(--mono); font-size:12.5px; background:var(--panel-2); border:1px solid var(--line-soft); border-radius:var(--radius); padding:10px 12px; color:var(--text-dim); line-height:1.6;}
.constraints{margin-top:14px; font-family:var(--mono); font-size:12px; color:var(--text-dim); line-height:1.8;}
.constraints li{margin-bottom:2px;}

/* ---------- Quiz form elements ---------- */
.step{margin-bottom:22px;}
.step-q{font-size:14px; font-weight:600; margin-bottom:12px;}
.options{display:flex; flex-direction:column; gap:8px;}
.opt{
  display:flex; align-items:center; gap:10px;
  padding:10px 14px; border:1px solid var(--line); border-radius:var(--radius);
  cursor:pointer; font-size:13.5px; color:var(--text-dim); background:var(--panel-2);
  transition:border-color .15s, color .15s, background .15s;
}
.opt:hover{border-color:var(--accent-dim); color:var(--text);}
.opt input{accent-color:var(--accent);}
.opt.selected{border-color:var(--accent); color:var(--text); background:rgba(245,184,74,0.06);}
.opt.reveal-correct{border-color:var(--good); background:rgba(74,222,158,0.06); color:var(--text);}
.opt.reveal-wrong{border-color:var(--bad); background:rgba(251,113,133,0.06); color:var(--text);}
.opt-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
@media (max-width:640px){.opt-grid{grid-template-columns:1fr;}}

.btn{
  font-family:var(--mono); font-size:12.5px; letter-spacing:0.04em;
  padding:11px 20px; border-radius:var(--radius); border:1px solid var(--accent);
  background:var(--accent); color:#1A1206; font-weight:600; cursor:pointer;
}
.btn:hover{filter:brightness(1.08);}
.btn.secondary{background:transparent; color:var(--text-dim); border-color:var(--line);}
.btn.secondary:hover{color:var(--text); border-color:var(--accent-dim);}
.btn:disabled{opacity:0.4; cursor:not-allowed;}
.btn-row{display:flex; gap:10px; margin-top:24px; flex-wrap:wrap;}
.picker-row{margin-top:18px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.picker-row label{font-family:var(--mono); font-size:11.5px; color:var(--text-faint);}

/* ---------- Review ---------- */
.review-row{display:grid; grid-template-columns:130px 1fr; gap:14px; padding:10px 0; border-bottom:1px solid var(--line-soft); font-size:13.5px;}
.review-row:last-child{border-bottom:none;}
.review-key{font-family:var(--mono); font-size:11px; color:var(--text-faint); letter-spacing:0.05em; padding-top:2px;}
.review-val{color:var(--text);}
.tag{display:inline-block; font-family:var(--mono); font-size:11px; padding:2px 8px; border-radius:2px; margin:2px 4px 2px 0; border:1px solid var(--line);}
.tag.good{color:var(--good); border-color:#1f4d3a; background:rgba(74,222,158,0.06);}
.tag.bad{color:var(--bad); border-color:#5c2a33; background:rgba(251,113,133,0.06);}
.explain-list{margin:0; padding-left:18px; font-size:13.5px; line-height:1.9; color:var(--text-dim);}
.explain-list li::marker{color:var(--accent); font-family:var(--mono);}
pre.template{
  background:var(--panel-2); border:1px solid var(--line-soft); border-radius:var(--radius);
  padding:16px; font-family:var(--mono); font-size:12.5px; line-height:1.7; color:var(--text);
  overflow-x:auto; margin:0;
}
.score-banner{display:flex; align-items:center; gap:14px; margin-bottom:18px;}
.score-num{font-family:var(--mono); font-size:30px; font-weight:700; color:var(--accent);}
.score-label{font-size:12.5px; color:var(--text-dim);}

/* ---------- Pattern library ---------- */
.lib-controls{display:flex; gap:10px; margin-bottom:20px;}
.search-input{
  flex:1; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:10px 14px; color:var(--text); font-family:var(--sans); font-size:13.5px;
}
.search-input:focus{outline:none; border-color:var(--accent-dim);}
.textarea-input{width:100%; font-family:var(--mono); font-size:13px; line-height:1.6; resize:vertical; min-height:70px;}
.pattern-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px;}
.pattern-card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px 18px; cursor:pointer; transition:border-color .15s;
  /* rendered as <button>: reset native button styles */
  display:block; width:100%; text-align:left; color:inherit; font:inherit;
}
.pattern-card:hover{border-color:var(--accent-dim);}
.pattern-card-cat{font-family:var(--mono); font-size:9.5px; color:var(--text-faint); letter-spacing:0.08em; text-transform:uppercase;}
.pattern-card-name{font-size:15px; font-weight:600; margin:6px 0 6px;}
.pattern-card-desc{font-size:12.5px; color:var(--text-dim); line-height:1.5;}
.pattern-card-acc{margin-top:10px; font-family:var(--mono); font-size:11px; color:var(--text-faint);}

.back-link{font-family:var(--mono); font-size:11.5px; color:var(--text-dim); cursor:pointer; margin-bottom:18px; display:inline-block; background:none; border:none; padding:0;}
.back-link:hover{color:var(--accent);}
.detail-section{margin-bottom:22px;}
.detail-label{font-family:var(--mono); font-size:11px; color:var(--text-faint); letter-spacing:0.08em; text-transform:uppercase; margin-bottom:10px;}
.chip-row{display:flex; flex-wrap:wrap; gap:6px;}
.chip{font-family:var(--mono); font-size:12px; padding:4px 10px; border:1px solid var(--line); border-radius:2px; color:var(--text-dim); background:var(--panel-2);}
.comparison-table{width:100%; border-collapse:collapse; font-size:13px;}
.comparison-table th{font-family:var(--mono); font-size:10.5px; color:var(--accent); text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); letter-spacing:0.04em;}
.comparison-table td{padding:8px 10px; border-bottom:1px solid var(--line-soft); color:var(--text-dim); line-height:1.5;}
.related-row{display:flex; gap:8px; flex-wrap:wrap;}
.related-chip{font-family:var(--mono); font-size:12px; padding:5px 12px; border:1px solid var(--line); border-radius:20px; color:var(--text-dim); cursor:pointer; background:none;}
.table-scroll{overflow-x:auto;}
.lib-count{font-family:var(--mono); font-size:11px; color:var(--text-faint); margin:-8px 0 14px;}
.home-link{display:flex; align-items:center; gap:6px; margin-top:12px; font-family:var(--mono); font-size:10.5px; letter-spacing:0.05em; color:var(--text-faint); text-decoration:none;}
.home-link:hover{color:var(--accent);}
.mobile-home{display:none;}

/* ---------- Accessibility ---------- */
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.opt:has(input:focus-visible){border-color:var(--accent); box-shadow:0 0 0 1px var(--accent);}
.opt input:focus-visible{outline:none;}
.search-input:focus-visible, .diag-field input:focus-visible, .diag-field textarea:focus-visible{outline:none; border-color:var(--accent);}
.sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;}
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{transition-duration:0.01ms !important; animation-duration:0.01ms !important; scroll-behavior:auto !important;}
}
.related-chip:hover{border-color:var(--accent); color:var(--accent);}
.recognition-q{
  font-style:italic; font-size:14px; color:var(--text); padding:14px 16px;
  border-left:2px solid var(--accent); background:var(--panel-2); line-height:1.6;
}

/* ---------- Progress ---------- */
.stat-row{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:24px;}
.stat-box{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px;}
.stat-num{font-family:var(--mono); font-size:24px; font-weight:700; color:var(--accent);}
.stat-lbl{font-family:var(--mono); font-size:10.5px; color:var(--text-faint); letter-spacing:0.05em; margin-top:4px;}
.perf-row{display:flex; align-items:center; gap:14px; padding:10px 0; border-bottom:1px solid var(--line-soft);}
.perf-name{width:170px; flex-shrink:0; font-size:13px;}
.perf-bar-track{flex:1; height:8px; background:var(--panel-2); border:1px solid var(--line); border-radius:4px; overflow:hidden;}
.perf-bar-fill{height:100%; background:var(--accent);}
.perf-bar-fill.weak{background:var(--bad);}
.perf-bar-fill.strong{background:var(--good);}
.perf-pct{width:44px; text-align:right; font-family:var(--mono); font-size:12px; color:var(--text-dim);}
.history-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line-soft); font-size:13px;}
.history-left{display:flex; align-items:center; gap:10px;}
.history-dot{width:7px; height:7px; border-radius:50%;}
.history-dot.ok{background:var(--good);}
.history-dot.no{background:var(--bad);}
.history-time{font-family:var(--mono); font-size:11px; color:var(--text-faint);}
.empty-state{padding:40px 20px; text-align:center; color:var(--text-faint); font-size:13.5px; border:1px dashed var(--line); border-radius:var(--radius);}

select.pattern-select{
  background:var(--panel); border:1px solid var(--line); color:var(--text);
  font-family:var(--mono); font-size:12.5px; padding:9px 12px; border-radius:var(--radius);
}

/* ---------- Interactive Diagrams ---------- */
.diag-controls{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom:16px;}
.diag-field{display:flex; flex-direction:column; gap:5px;}
.diag-field label{font-family:var(--mono); font-size:10px; color:var(--text-faint); letter-spacing:0.05em; text-transform:uppercase;}
.diag-field input{background:var(--panel-2); border:1px solid var(--line); color:var(--text); font-family:var(--mono); font-size:12.5px; padding:8px 10px; border-radius:var(--radius); width:170px;}
.diag-field input:focus{outline:none; border-color:var(--accent-dim);}
.diag-field textarea{background:var(--panel-2); border:1px solid var(--line); color:var(--text); padding:8px 10px; border-radius:var(--radius);}
.diag-field textarea:focus{outline:none; border-color:var(--accent-dim);}
.diag-stage{background:var(--panel-2); border:1px solid var(--line-soft); border-radius:var(--radius); padding:26px 20px 20px;}
.diag-array-row{display:flex; gap:8px; flex-wrap:wrap; align-items:flex-start; justify-content:center;}
.diag-box{
  width:46px; height:46px; display:flex; align-items:center; justify-content:center;
  border:1.5px solid var(--line); border-radius:4px; font-family:var(--mono); font-size:13px;
  color:var(--text-dim); background:var(--panel); position:relative; flex-shrink:0;
  transition:border-color .25s ease, background .25s ease, color .25s ease, opacity .25s ease;
}
.diag-box .idx{position:absolute; bottom:-19px; font-size:9.5px; color:var(--text-faint); left:50%; transform:translateX(-50%);}
.diag-box .sub{position:absolute; top:-20px; font-size:9px; color:var(--accent); white-space:nowrap; left:50%; transform:translateX(-50%);}
.diag-box.active{border-color:var(--accent); color:var(--text); box-shadow:0 0 8px rgba(245,184,74,0.35);}
.diag-box.window{background:rgba(245,184,74,0.10); border-color:var(--accent-dim); color:var(--text);}
.diag-box.good{border-color:var(--good); color:var(--text); background:rgba(74,222,158,0.10);}
.diag-box.bad{border-color:var(--bad); color:var(--text); background:rgba(251,113,133,0.10);}
.diag-box.dim{opacity:0.3;}
.diag-col{display:flex; flex-direction:column; align-items:center; margin-bottom:22px;}
.diag-ptr{font-family:var(--mono); font-size:10px; color:var(--accent); margin-top:24px; height:14px;}
.diag-status{font-family:var(--mono); font-size:12.5px; color:var(--text-dim); margin-top:16px; min-height:38px; line-height:1.6;}
.diag-transport{display:flex; align-items:center; gap:10px; margin-top:16px; flex-wrap:wrap;}
.diag-slider{flex:1; min-width:120px; accent-color:var(--accent);}
.diag-count{font-family:var(--mono); font-size:11px; color:var(--text-faint); white-space:nowrap;}
.diag-side-panel{margin-top:16px; display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
.diag-side-label{font-family:var(--mono); font-size:10px; color:var(--text-faint); letter-spacing:0.05em; margin-right:4px;}
.diag-chip{font-family:var(--mono); font-size:11.5px; padding:4px 9px; border:1px solid var(--line); border-radius:3px; color:var(--text-dim); background:var(--panel);}
.diag-sandbox-note{font-size:12.5px; color:var(--text-dim); margin-bottom:16px; line-height:1.5;}

/* Grid-based diagrams (DFS / BFS) */
.diag-grid-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:2px;}
.diag-grid-wrap{display:flex; flex-direction:column; gap:4px; align-items:center; width:max-content; margin:0 auto;}
.diag-grid-row{display:flex; gap:4px;}
.diag-cell{
  width:34px; height:34px; display:flex; align-items:center; justify-content:center;
  border:1.5px solid var(--line); border-radius:4px; font-family:var(--mono); font-size:11px;
  color:var(--text-dim); background:var(--panel); transition:all .25s ease; flex-shrink:0;
}
.diag-cell.water{opacity:0.35;}
/* Node-based diagrams (Union-Find) */
.diag-node{
  width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-size:12px; border:1.5px solid var(--line); background:var(--panel);
  color:var(--text-dim); transition:all .25s ease; flex-shrink:0;
}
.diag-cell.active, .diag-node.active{border-color:var(--accent) !important; box-shadow:0 0 8px rgba(245,184,74,0.4);}
.diag-cell.c0, .diag-node.c0{background:rgba(94,234,212,0.18); border-color:#5EEAD4; color:var(--text);}
.diag-cell.c1, .diag-node.c1{background:rgba(245,184,74,0.18); border-color:var(--accent); color:var(--text);}
.diag-cell.c2, .diag-node.c2{background:rgba(251,113,133,0.18); border-color:var(--bad); color:var(--text);}
.diag-cell.c3, .diag-node.c3{background:rgba(129,140,248,0.18); border-color:#818CF8; color:var(--text);}
.diag-cell.c4, .diag-node.c4{background:rgba(74,222,158,0.18); border-color:var(--good); color:var(--text);}
.diag-cell.c5, .diag-node.c5{background:rgba(244,114,182,0.18); border-color:#F472B6; color:var(--text);}
/* Wide box for interval/text labels (Greedy) */
.diag-box-wide{width:auto; min-width:60px; padding:0 10px;}

@media (max-width:800px){
  #app{flex-direction:column;}
  .sidebar{width:100%; height:auto; position:relative; flex-direction:row; overflow-x:auto; padding:12px;}
  .brand{display:none;}
  .nav{flex-direction:row; padding:0;}
  .sidebar-foot{display:none;}
  .main{padding:24px 18px 60px;}
  .stat-row{grid-template-columns:1fr;}

  /* Prevent iOS Safari auto-zoom on focus (triggers below 16px). */

const STORAGE_KEY = "lpt_attempts_v1";
const MAX_ATTEMPTS = 1000; // keep localStorage bounded
function loadAttempts(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    const data = raw ? JSON.parse(raw) : [];
    // Guard against corrupted / hand-edited storage
    return Array.isArray(data)
      ? data.filter(a => a && typeof a === "object" && typeof a.pattern === "string")
      : [];
  }catch(e){ return []; }
}
function saveAttempt(attempt){
  const all = loadAttempts();
  all.push(attempt);
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(all.slice(-MAX_ATTEMPTS))); }catch(e){}
}
function clearAttempts(){
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
}

function pickRandomProblem(filterPatternId){
  let pool = filterPatternId ? PROBLEMS.filter(p=>p.primaryPattern===filterPatternId) : PROBLEMS;
  if(!pool.length) return null;
  // Don't hand back the problem the user just did, if there's any alternative.
  if(currentProblem && pool.length>1) pool = pool.filter(p=>p.id!==currentProblem.id);
  return pool[Math.floor(Math.random()*pool.length)];
}

function computePatternStats(){
  const attempts = loadAttempts();
  const stats = {};
  PATTERNS.forEach(p => stats[p.id] = {attempts:0, correct:0});
  attempts.forEach(a => {
    if(!stats[a.pattern]) stats[a.pattern] = {attempts:0, correct:0};
    stats[a.pattern].attempts++;
    if(a.patternCorrect) stats[a.pattern].correct++;
  });
  return stats;
}

function overallAccuracy(){
  const attempts = loadAttempts();
  if(!attempts.length) return null;
  const correct = attempts.filter(a=>a.patternCorrect).length;
  return Math.round((correct/attempts.length)*100);
}

function weakestPattern(){
  const stats = computePatternStats();
  let weakest = null, weakestAcc = 101;
  Object.entries(stats).forEach(([id, s]) => {
    if(s.attempts >= 1){
      const acc = (s.correct/s.attempts)*100;
      if(acc < weakestAcc){ weakestAcc = acc; weakest = id; }
    }
  });
  // Nothing actually weak yet? Point at a pattern that hasn't been tried.
  if(weakestAcc >= 100){
    const untried = PATTERNS.filter(p => !stats[p.id].attempts && PROBLEMS.some(q=>q.primaryPattern===p.id));
    if(untried.length) return untried[Math.floor(Math.random()*untried.length)].id;
  }
  return weakest;
}

function wirePracticeEvents(p){
  const keywordsInput = document.getElementById("keywordsInput");

    lbl.classList.toggle("selected", lbl.querySelector("input").checked);

      if(hint) hint.textContent = "";

function matchKeywords(userText, expectedClues){
  const userLower = (userText||"").toLowerCase();
  return expectedClues.filter(clue=>{
    const words = clue.toLowerCase().split(/\s+/).filter(w=>w.length>2);
    if(!words.length) return userLower.includes(clue.toLowerCase());
    return words.every(w=>userLower.includes(w));
  });
}

function submitQuiz(p){
  const patternCorrect = quizState.pattern === p.primaryPattern;
  const dsCorrectSet = new Set(p.dataStructures);
  const dsSelected = quizState.ds;
  const dsCorrect = dsSelected.size===dsCorrectSet.size && [...dsSelected].every(d=>dsCorrectSet.has(d));
  const complexityCorrect = acceptedComplexities(p).includes(quizState.complexity);
  const matchedClues = matchKeywords(quizState.keywordsText, p.recognitionClues);

  quizState.submitted = true;
  quizState.result = { patternCorrect, dsCorrect, complexityCorrect, matchedClues, cluesTotal:p.recognitionClues.length };

  saveAttempt({
    problemId:p.id,
    pattern:p.primaryPattern,
    patternCorrect,
    dsCorrect,
    complexityCorrect,
    timestamp: Date.now()
  });

  renderPractice();
  renderSidebarFoot();
  // Bring the result into view and move focus there for keyboard/screen-reader users.
  const review = document.getElementById("reviewCard");
  if(review){
    review.setAttribute("tabindex","-1");
    review.focus({preventScroll:true});
    review.scrollIntoView({block:"start"});
  }
}

/* ---- Sliding Window: longest window with sum <= maxSum ---- */
function computeSlidingWindow({array, maxSum}){
  const steps=[]; let left=0, sum=0, bestLen=0, bestRange=[-1,-1];
  steps.push({left:0,right:-1,bestRange:[-1,-1],message:`Start: left=0, sum=0. Expand right to grow the window.`});
  for(let right=0; right<array.length; right++){
    sum += array[right];
    let msg = `right→${right}: add nums[${right}]=${array[right]}, window sum=${sum}.`;
    while(sum>maxSum && left<=right){
      sum -= array[left];
      msg += ` Sum exceeds ${maxSum} — shrink: remove nums[${left}]=${array[left]}, left→${left+1}.`;
      left++;
    }
    const len = right-left+1;
    if(len>bestLen){ bestLen=len; bestRange=[left,right]; msg += ` New best length ${bestLen}.`; }
    steps.push({left,right,bestRange:[...bestRange],message:msg});
  }
  steps.push({left,right:array.length-1,bestRange:[...bestRange],final:true,message: bestLen
    ? `Done. Longest window with sum ≤ ${maxSum} has length ${bestLen} (indices [${bestRange[0]},${bestRange[1]}]).`
    : `Done. No window has sum ≤ ${maxSum} — every single element is already too large.`});
  return steps;
}
function renderSlidingWindow(stage, step, input){
  stage.innerHTML = arrayStageHTML(input.array, {
    boxClass:(i)=>{
      let c="";
      if(!step.final && i>=step.left && i<=step.right) c+=" window";
      if(step.final && i>=step.bestRange[0] && i<=step.bestRange[1]) c+=" good";
      if((i===step.left || i===step.right) && !step.final) c+=" active";
      return c;
    },
    ptrLabel:(i)=>{
      if(step.final) return "";
      const l=[]; if(i===step.left) l.push("L"); if(i===step.right) l.push("R"); return l.join("/");
    }
  });
}

/* ---- Two Pointers: pair summing to target on a sorted array ---- */
function computeTwoPointers({array, target}){
  const arr = array; const steps=[]; let left=0, right=arr.length-1;
  if(!arr.length) return [{left:0,right:-1,message:"Array is empty."}];
  steps.push({left,right,found:null,message:`Start: left=0 (${arr[left]}), right=${arr.length-1} (${arr[right]}).`});
  while(left<right){
    const sum = arr[left]+arr[right];
    let msg = `left=${left}(${arr[left]}) + right=${right}(${arr[right]}) = ${sum}.`;
    if(sum===target){ msg+=` Equals target ${target} — found!`; steps.push({left,right,found:[left,right],message:msg}); left=right; break; }
    else if(sum<target){ msg+=` Less than ${target}, move left→${left+1}.`; left++; steps.push({left,right,found:null,message:msg}); }
    else { msg+=` Greater than ${target}, move right→${right-1}.`; right--; steps.push({left,right,found:null,message:msg}); }
  }
  const last = steps[steps.length-1];
  if(!last.found){ steps.push({left,right,found:null,final:true,message:`Pointers crossed — no pair sums to ${target}.`}); }
  return steps;
}
function renderTwoPointers(stage, step, input){
  stage.innerHTML = arrayStageHTML(input.array, {
    boxClass:(i)=>{
      if(step.found && (i===step.found[0]||i===step.found[1])) return " good";
      if(i===step.left || i===step.right) return " active";
      return "";
    },
    ptrLabel:(i)=>{
      const l=[]; if(i===step.left) l.push("L"); if(i===step.right) l.push("R"); return l.join("/");
    }
  });
}

/* ---- Binary Search ---- */
function computeBinarySearch({array, target}){
  const arr = array; const steps=[]; let lo=0, hi=arr.length-1;
  if(!arr.length) return [{lo:0,hi:-1,mid:null,message:"Array is empty."}];
  steps.push({lo,hi,mid:null,found:false,message:`Start: lo=0, hi=${hi}.`});
  while(lo<=hi){
    const mid = Math.floor((lo+hi)/2);
    let msg = `mid=${mid} (value ${arr[mid]}).`;
    if(arr[mid]===target){ msg+=` Equals target ${target} — found at index ${mid}!`; steps.push({lo,hi,mid,found:true,message:msg}); lo=hi+1; break; }
    else if(arr[mid]<target){ msg+=` Less than target ${target} — discard left half, lo→${mid+1}.`; steps.push({lo,hi,mid,found:false,message:msg}); lo=mid+1; }
    else { msg+=` Greater than target ${target} — discard right half, hi→${mid-1}.`; steps.push({lo,hi,mid,found:false,message:msg}); hi=mid-1; }
  }
  const last = steps[steps.length-1];
  if(!last.found){ steps.push({lo,hi,mid:null,found:false,final:true,message:`Search space is empty — ${target} is not in the array.`}); }
  return steps;
}
function renderBinarySearch(stage, step, input){
  stage.innerHTML = arrayStageHTML(input.array, {
    boxClass:(i)=>{
      let c="";
      if(i<step.lo || i>step.hi) c+=" dim";
      if(i===step.mid) c += step.found ? " good" : " active";
      return c;
    },
    ptrLabel:(i)=>{
      const l=[]; if(i===step.lo) l.push("lo"); if(i===step.hi) l.push("hi"); if(i===step.mid) l.push("mid"); return l.join("/");
    }
  });
}

/* ---- Monotonic Stack: Next Greater Element ---- */
function computeMonotonicStack({array}){
  const arr = array; const steps=[]; const stack=[]; const result=new Array(arr.length).fill(-1);
  if(!arr.length) return [{i:-1,stack:[],result:[],message:"Array is empty."}];
  steps.push({i:-1,stack:[],result:[...result],message:`Start with an empty stack.`});
  for(let i=0;i<arr.length;i++){
    while(stack.length && arr[i]>arr[stack[stack.length-1]]){
      const idx = stack.pop();
      result[idx] = arr[i];
      steps.push({i,stack:[...stack],result:[...result],poppedIdx:idx,message:`i=${i}(${arr[i]}): pop index ${idx} (${arr[idx]}) — its next greater element is ${arr[i]}.`});
    }
    stack.push(i);
    steps.push({i,stack:[...stack],result:[...result],message:`i=${i}(${arr[i]}): push index ${i} onto the stack.`});
  }
  steps.push({i:arr.length,stack:[...stack],result:[...result],final:true,message:`Done. Remaining indices in the stack have no next greater element (-1).`});
  return steps;
}
function renderMonotonicStack(stage, step, input){
  const arr = input.array;
  let html = arrayStageHTML(arr, {
    boxClass:(i)=>{
      let c="";
      if(step.stack.includes(i)) c+=" window";
      if(i===step.i) c+=" active";
      if(i===step.poppedIdx) c+=" good";
      return c;
    }
  });
  html += `<div class="diag-side-panel"><span class="diag-side-label">STACK (bottom→top)</span> ${step.stack.length ? step.stack.map(idx=>`<span class="diag-chip">idx ${idx} (${arr[idx]})</span>`).join("") : `<span class="diag-chip">empty</span>`}</div>`;
  html += `<div class="diag-side-panel"><span class="diag-side-label">RESULT</span> ${step.result.map((r,i)=>`<span class="diag-chip">${i}:${r}</span>`).join("")}</div>`;
  stage.innerHTML = html;
}

/* ---- Prefix Sum ---- */
function computePrefixSum({array, qi, qj}){
  const arr = array; const steps=[]; const prefix=new Array(arr.length+1).fill(0);
  if(!arr.length) return [{builtUpTo:-1,prefix:[0],message:"Array is empty."}];
  steps.push({builtUpTo:-1,prefix:[...prefix],message:`prefix[0] = 0 (sum of zero elements).`});
  for(let i=0;i<arr.length;i++){
    prefix[i+1] = prefix[i]+arr[i];
    steps.push({builtUpTo:i,prefix:[...prefix],message:`prefix[${i+1}] = prefix[${i}] + nums[${i}] = ${prefix[i]} + ${arr[i]} = ${prefix[i+1]}.`});
  }
  const i = Math.max(0, Math.min(qi, arr.length-1));
  const j = Math.max(i, Math.min(qj, arr.length-1));
  const rangeSum = prefix[j+1]-prefix[i];
  steps.push({builtUpTo:arr.length-1,prefix:[...prefix],query:[i,j],final:true,message:`Range sum [${i},${j}] = prefix[${j+1}] − prefix[${i}] = ${prefix[j+1]} − ${prefix[i]} = ${rangeSum}. No rescanning needed.`});
  return steps;
}
function renderPrefixSum(stage, step, input){
  stage.innerHTML = arrayStageHTML(input.array, {
    boxClass:(i)=>{
      let c="";
      if(i<=step.builtUpTo) c+=" good";
      if(step.query && i>=step.query[0] && i<=step.query[1]) c+=" active";
      return c;
    },
    subLabel:(i)=> i<=step.builtUpTo ? `Σ=${step.prefix[i+1]}` : ""
  });
}

/* ---- Hash Map: Two Sum ---- */
function computeHashMap({array, target}){
  const arr = array; const steps=[]; const seen = new Map();
  if(!arr.length) return [{i:-1,seen:new Map(),message:"Array is empty."}];
  steps.push({i:-1,seen:new Map(),found:null,message:`Start with an empty map of value→index.`});
  for(let i=0;i<arr.length;i++){
    const complement = target-arr[i];
    if(seen.has(complement)){
      steps.push({i,seen:new Map(seen),found:[seen.get(complement), i],final:true,message:`i=${i}(${arr[i]}): need complement ${complement} — found at index ${seen.get(complement)}! Pair (${seen.get(complement)}, ${i}).`});
      return steps;
    }
    seen.set(arr[i], i);
    steps.push({i,seen:new Map(seen),found:null,message:`i=${i}(${arr[i]}): need complement ${complement} — not seen yet. Store seen[${arr[i]}]=${i}.`});
  }
  steps.push({i:arr.length,seen:new Map(seen),found:null,final:true,message:`Done scanning — no pair sums to ${target}.`});
  return steps;
}
function renderHashMap(stage, step, input){
  const arr = input.array;
  let html = arrayStageHTML(arr, {
    boxClass:(i)=>{
      if(step.found && (i===step.found[0]||i===step.found[1])) return " good";
      if(i===step.i) return " active";
      return "";
    }
  });
  const entries = [...step.seen.entries()];
  html += `<div class="diag-side-panel"><span class="diag-side-label">SEEN MAP</span> ${entries.length ? entries.map(([v,idx])=>`<span class="diag-chip">${v} → idx ${idx}</span>`).join("") : `<span class="diag-chip">empty</span>`}</div>`;
  stage.innerHTML = html;
}

/* ---- shared grid/interval/edge parsing helpers ---- */
function parseGrid(str, allowed){
  const rows = String(str).replace(/\r/g,"").split("\n").map(r=>r.trim()).filter(r=>r.length>0).slice(0,8);
  return rows.map(r=>r.split("").filter(ch=>allowed.includes(ch)).slice(0,8));
}
function normalizeGrid(grid, fillChar){
  const maxLen = Math.max(1, ...grid.map(r=>r.length));
  return grid.map(r=> r.length<maxLen ? [...r, ...new Array(maxLen-r.length).fill(fillChar)] : r);
}
function cloneGrid(g){ return g.map(row=>[...row]); }
function parseIntervals(str){
  return String(str).split(",").map(s=>s.trim()).filter(Boolean).map(pair=>{
    const [s,e] = pair.split("-").map(x=>parseInt(x.trim(),10));
    return {start:s, end:e};
  }).filter(iv=>!isNaN(iv.start) && !isNaN(iv.end)).slice(0,10);
}
function parseEdges(str){
  return String(str).split(",").map(s=>s.trim()).filter(Boolean).map(pair=>{
    const parts = pair.split("-").map(x=>parseInt(x.trim(),10));
    return [parts[0], parts[1]];
  }).filter(e=>!isNaN(e[0]) && !isNaN(e[1])).slice(0,15);
}
const GRID_PALETTE = ["c0","c1","c2","c3","c4","c5"];

/* ---- DFS: Number of Islands (iterative, stack-based flood fill) ---- */
function computeDFSGrid({grid}){
  const rows=grid.length, cols=grid[0]?grid[0].length:0;
  const visited = Array.from({length:rows},()=>new Array(cols).fill(false));
  const compId = Array.from({length:rows},()=>new Array(cols).fill(-1));
  const steps=[]; let islandCount=0;
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  steps.push({visited:cloneGrid(visited), compId:cloneGrid(compId), stack:[], current:null, islandCount, message:`Scan for an unvisited land cell to start a new island.`});
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      if(grid[r][c]==="1" && !visited[r][c]){
        islandCount++;
        const myId = islandCount-1;
        const stack=[[r,c]];
        visited[r][c]=true;
        steps.push({visited:cloneGrid(visited), compId:cloneGrid(compId), stack:[...stack], current:[r,c], islandCount, message:`Unvisited land at (${r},${c}) — start island #${islandCount}, push onto stack.`});
        while(stack.length){
          const [cr,cc] = stack.pop();
          compId[cr][cc]=myId;
          steps.push({visited:cloneGrid(visited), compId:cloneGrid(compId), stack:[...stack], current:[cr,cc], islandCount, message:`Pop (${cr},${cc}) — mark as island #${islandCount}.`});
          for(const [dr,dc] of dirs){
            const nr=cr+dr, nc=cc+dc;
            if(nr>=0 && nr<rows && nc>=0 && nc<cols && grid[nr][nc]==="1" && !visited[nr][nc]){
              visited[nr][nc]=true;
              stack.push([nr,nc]);
              steps.push({visited:cloneGrid(visited), compId:cloneGrid(compId), stack:[...stack], current:[cr,cc], islandCount, message:`Neighbor (${nr},${nc}) is unvisited land — push it.`});
            }
          }
        }
      }
    }
  }
  steps.push({visited:cloneGrid(visited), compId:cloneGrid(compId), stack:[], current:null, islandCount, final:true, message:`Done. Found ${islandCount} island(s).`});
  return steps;
}
function renderDFSGrid(stage, step, input){
  const grid = input.grid;
  let html = `<div class="diag-grid-scroll"><div class="diag-grid-wrap">`;
  for(let r=0;r<grid.length;r++){
    html += `<div class="diag-grid-row">`;
    for(let c=0;c<grid[r].length;c++){
      const isLand = grid[r][c]==="1";
      const id = step.compId[r][c];
      const isCurrent = step.current && step.current[0]===r && step.current[1]===c;
      let cls = "diag-cell";
      if(!isLand) cls += " water";
      if(id>=0) cls += " "+GRID_PALETTE[id % GRID_PALETTE.length];
      if(isCurrent) cls += " active";
      html += `<div class="${cls}">${isLand?'▲':'·'}</div>`;
    }
    html += `</div>`;
  }
  html += `</div></div>`;
  html += `<div class="diag-side-panel"><span class="diag-side-label">STACK (bottom→top)</span> ${step.stack.length?step.stack.map(([r,c])=>`<span class="diag-chip">(${r},${c})</span>`).join(""):'<span class="diag-chip">empty</span>'}</div>`;
  html += `<div class="diag-side-panel"><span class="diag-side-label">ISLANDS FOUND</span> <span class="diag-chip">${step.islandCount}</span></div>`;
  stage.innerHTML = html;
}

/* ---- BFS: Rotting Oranges (multi-source, level by level) ---- */
function computeBFSGrid({grid}){
  const rows=grid.length, cols=grid[0]?grid[0].length:0;
  const state = cloneGrid(grid);
  const level = Array.from({length:rows},()=>new Array(cols).fill(-1));
  let queue=[];
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) if(state[r][c]==="2"){ queue.push([r,c]); level[r][c]=0; }
  const steps=[];
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  let minute=0;
  let freshRemaining = state.flat().filter(v=>v==="1").length;
  steps.push({state:cloneGrid(state), level:cloneGrid(level), frontier:[...queue], minute:0, message:`Minute 0: start with ${queue.length} rotten orange(s) as sources.`});
  while(queue.length && freshRemaining>0){
    minute++;
    const next=[]; let rotted=0;
    for(const [r,c] of queue){
      for(const [dr,dc] of dirs){
        const nr=r+dr, nc=c+dc;
        if(nr>=0 && nr<rows && nc>=0 && nc<cols && state[nr][nc]==="1"){
          state[nr][nc]="2"; level[nr][nc]=minute; next.push([nr,nc]); rotted++; freshRemaining--;
        }
      }
    }
    queue=next;
    steps.push({state:cloneGrid(state), level:cloneGrid(level), frontier:[...queue], minute, message: rotted ? `Minute ${minute}: rot spreads to ${rotted} adjacent fresh orange(s).` : `Minute ${minute}: no new oranges rot.`});
  }
  const stillFresh = state.flat().filter(v=>v==="1").length;
  let maxLevel = 0;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) if(level[r][c]>maxLevel) maxLevel=level[r][c];
  steps.push({state:cloneGrid(state), level:cloneGrid(level), frontier:[], minute, final:true, message: stillFresh>0 ? `Done. ${stillFresh} fresh orange(s) unreachable — result is -1.` : `Done. All oranges rotten after ${maxLevel} minute(s).`});
  return steps;
}
function renderBFSGrid(stage, step){
  let html = `<div class="diag-grid-scroll"><div class="diag-grid-wrap">`;
  for(let r=0;r<step.state.length;r++){
    html += `<div class="diag-grid-row">`;
    for(let c=0;c<step.state[r].length;c++){
      const v = step.state[r][c];
      let cls="diag-cell", content="·";
      if(v==="1"){ content="●"; }
      else if(v==="2"){ cls+=" c2"; content = step.level[r][c]>=0 ? String(step.level[r][c]) : "✕"; }
      else { cls+=" water"; }
      if(step.frontier.some(([fr,fc])=>fr===r && fc===c)) cls+=" active";
      html += `<div class="${cls}">${content}</div>`;
    }
    html += `</div>`;
  }
  html += `</div></div>`;
  html += `<div class="diag-side-panel"><span class="diag-side-label">MINUTE</span> <span class="diag-chip">${step.minute}</span> <span class="diag-side-label">FRONTIER</span> ${step.frontier.length?step.frontier.map(([r,c])=>`<span class="diag-chip">(${r},${c})</span>`).join(""):'<span class="diag-chip">none</span>'}</div>`;
  stage.innerHTML = html;
}

/* ---- Heap: maintain top-K largest (kept sorted for clarity) ---- */
function computeHeapTopK({array, k}){
  const steps=[]; let kept=[];
  steps.push({kept:[...kept], i:-1, message:`Start with an empty top-${k} list.`});
  array.forEach((x,i)=>{
    kept.push(x); kept.sort((a,b)=>a-b);
    let msg = `Insert ${x} into the heap.`;
    if(kept.length>k){ const popped=kept.shift(); msg+=` Size exceeds ${k} — pop the smallest (${popped}).`; }
    steps.push({kept:[...kept], i, message:msg});
  });
  steps.push({kept:[...kept], i:array.length, final:true, message:`Done. The ${k} largest elements are: [${[...kept].sort((a,b)=>b-a).join(", ")}].`});
  return steps;
}
function renderHeapTopK(stage, step, input){
  let html = arrayStageHTML(input.array, {
    boxClass:(i)=> i===step.i ? " active" : (i<step.i ? " dim" : "")
  });
  html += `<div class="diag-side-panel"><span class="diag-side-label">HEAP CONTENTS (size ${input.k}, shown sorted)</span> ${step.kept.length? step.kept.map(v=>`<span class="diag-chip">${v}</span>`).join(""):'<span class="diag-chip">empty</span>'}</div>`;
  stage.innerHTML = html;
}

/* ---- Backtracking: generate all subsets ---- */
function computeBacktracking({array}){
  const steps=[]; const subsetsFound=[];
  function rec(index, path){
    if(index===array.length){
      subsetsFound.push([...path]);
      steps.push({path:[...path], subsetsFound:subsetsFound.map(s=>[...s]), message:`Reached the end — record subset [${path.join(",")}]${path.length?"":" (empty set)"}.`});
      return;
    }
    path.push(array[index]);
    steps.push({path:[...path], subsetsFound:subsetsFound.map(s=>[...s]), message:`Include ${array[index]} → path=[${path.join(",")}]. Recurse.`});
    rec(index+1, path);
    path.pop();
    steps.push({path:[...path], subsetsFound:subsetsFound.map(s=>[...s]), message:`Backtrack: remove ${array[index]} → path=[${path.join(",")}].`});
    steps.push({path:[...path], subsetsFound:subsetsFound.map(s=>[...s]), message:`Exclude ${array[index]} → path=[${path.join(",")}]. Recurse.`});
    rec(index+1, path);
  }
  steps.push({path:[], subsetsFound:[], message:`Start with an empty path.`});
  rec(0, []);
  steps.push({path:[], subsetsFound:subsetsFound.map(s=>[...s]), final:true, message:`Done. Found ${subsetsFound.length} subsets total (2^${array.length}).`});
  return steps;
}
function renderBacktracking(stage, step){
  let html = `<div style="font-family:var(--mono); font-size:12.5px; color:var(--text-dim); margin-bottom:16px;">CURRENT PATH: ${step.path.length? step.path.map(v=>`<span class="diag-chip good">${v}</span>`).join(""):'<span class="diag-chip">empty</span>'}</div>`;
  html += `<div class="diag-side-panel"><span class="diag-side-label">SUBSETS FOUND (${step.subsetsFound.length})</span></div>`;
  html += `<div class="diag-side-panel">${step.subsetsFound.length? step.subsetsFound.map(s=>`<span class="diag-chip">[${s.join(",")}]</span>`).join(""):'<span class="diag-chip">none yet</span>'}</div>`;
  stage.innerHTML = html;
}

/* ---- Dynamic Programming: Climbing Stairs (1D bottom-up) ---- */
function computeDP({n}){
  const dp = new Array(n+1).fill(null);
  const steps=[];
  dp[0]=1; if(n>=1) dp[1]=1;
  steps.push({dp:[...dp], i:1, message:`Base cases: dp[0]=1 (one way — stay put), dp[1]=1 (one way — a single step).`});
  for(let i=2;i<=n;i++){
    dp[i]=dp[i-1]+dp[i-2];
    steps.push({dp:[...dp], i, message:`dp[${i}] = dp[${i-1}] + dp[${i-2}] = ${dp[i-1]} + ${dp[i-2]} = ${dp[i]}.`});
  }
  steps.push({dp:[...dp], i:n, final:true, message:`Done. dp[${n}] = ${dp[n]} distinct ways to climb ${n} stairs.`});
  return steps;
}
function renderDP(stage, step){
  const displayArr = step.dp.map(v => v===null ? "?" : v);
  stage.innerHTML = arrayStageHTML(displayArr, {
    boxClass:(i)=>{
      let c="";
      if(i===step.i) c+=" active";
      if(i===step.i-1 || i===step.i-2) c+=" good";
      return c;
    },
    subLabel:(i)=> "dp["+i+"]"
  });
}

/* ---- Greedy: Non-overlapping Intervals (sort by end, scan) ---- */
function computeGreedy({intervals}){
  const withOrig = intervals.map((iv,i)=>({...iv, orig:i}));
  const sorted = [...withOrig].sort((a,b)=>a.end-b.end);
  const steps=[];
  steps.push({sorted:sorted.map(s=>({...s})), selected:[], removed:[], cursor:-1, message:`Sort intervals by end time: [${sorted.map(s=>`${s.start}–${s.end}`).join(", ")}].`});
  let lastEnd=-Infinity; const selected=[]; const removed=[];
  sorted.forEach((iv,idx)=>{
    if(iv.start>=lastEnd){
      selected.push(iv.orig); const prevEnd=lastEnd; lastEnd=iv.end;
      steps.push({sorted:sorted.map(s=>({...s})), selected:[...selected], removed:[...removed], cursor:idx, message:`[${iv.start}–${iv.end}] starts at/after lastEnd — keep it. lastEnd→${iv.end}.`});
    } else {
      removed.push(iv.orig);
      steps.push({sorted:sorted.map(s=>({...s})), selected:[...selected], removed:[...removed], cursor:idx, message:`[${iv.start}–${iv.end}] overlaps (starts before lastEnd=${lastEnd}) — remove it.`});
    }
  });
  steps.push({sorted:sorted.map(s=>({...s})), selected:[...selected], removed:[...removed], cursor:sorted.length, final:true, message:`Done. Removed ${removed.length} interval(s) to make the rest non-overlapping.`});
  return steps;
}
function renderGreedy(stage, step){
  let html = `<div class="diag-array-row">`;
  step.sorted.forEach((iv,idx)=>{
    let cls = "diag-box diag-box-wide";
    if(step.selected.includes(iv.orig)) cls += " good";
    else if(step.removed.includes(iv.orig)) cls += " bad";
    if(idx===step.cursor) cls += " active";
    html += `<div class="diag-col"><div class="${cls}">${iv.start}–${iv.end}</div></div>`;
  });
  html += `</div>`;
  html += `<div class="diag-side-panel"><span class="diag-side-label">KEPT</span> <span class="diag-chip">${step.selected.length}</span> <span class="diag-side-label">REMOVED</span> <span class="diag-chip">${step.removed.length}</span></div>`;
  stage.innerHTML = html;
}

/* ---- Union-Find: merge components across a list of edges ---- */
function computeUnionFind({n, edges}){
  const parent = Array.from({length:n}, (_,i)=>i);
  function find(x){ while(parent[x]!==x){ parent[x]=parent[parent[x]]; x=parent[x]; } return x; }
  const steps=[];
  steps.push({parent:[...parent], a:null, b:null, message:`Start: each of the ${n} nodes is its own parent (its own component).`});
  edges.forEach(([a,b])=>{
    const ra=find(a), rb=find(b);
    let msg = `Union(${a}, ${b}): find(${a})=${ra}, find(${b})=${rb}.`;
    if(ra!==rb){ parent[ra]=rb; msg += ` Different roots — merge: parent[${ra}]=${rb}.`; }
    else { msg += ` Already in the same component — no merge needed.`; }
    steps.push({parent:[...parent], a, b, message:msg});
  });
  function rootOf(arr,x){ let c=x; while(arr[c]!==c) c=arr[c]; return c; }
  const roots = new Set(parent.map((_,i)=>rootOf(parent,i)));
  steps.push({parent:[...parent], a:null, b:null, final:true, message:`Done. ${roots.size} connected component(s) remain.`});
  return steps;
}
function renderUnionFind(stage, step, input){
  const n = input.n;
  function root(x){ let c=x; while(step.parent[c]!==c) c=step.parent[c]; return c; }
  const rootColorMap = {};
  let html = `<div class="diag-array-row">`;
  for(let i=0;i<n;i++){
    const r = root(i);
    if(!(r in rootColorMap)) rootColorMap[r] = GRID_PALETTE[Object.keys(rootColorMap).length % GRID_PALETTE.length];
    let cls = "diag-node "+rootColorMap[r];
    if(step.a===i || step.b===i) cls += " active";
    html += `<div class="diag-col"><div class="${cls}">${i}</div></div>`;
  }
  html += `</div>`;
  html += `<div class="diag-side-panel"><span class="diag-side-label">PARENT[]</span> ${step.parent.map((p,i)=>`<span class="diag-chip">${i}→${p}</span>`).join("")}</div>`;
  stage.innerHTML = html;
}

let diagramInstanceCounter = 0;
let stopActiveDiagram = null; // set by the currently mounted diagram; called before mounting a new one or leaving Practice

function mountDiagram(container, patternId){
  const spec = DIAGRAM_REGISTRY[patternId];
  const pattern = PATTERNS.find(x=>x.id===patternId);

  // Stop any previously mounted diagram's auto-play timer so it can never keep writing
  // into a hidden/replaced view after the user moves on.
  if(stopActiveDiagram){ stopActiveDiagram(); stopActiveDiagram = null; }

  if(!spec){
    container.innerHTML = `<div class="empty-state">Interactive diagram for ${pattern?pattern.name:'this pattern'} is coming soon. For now, use the template and explanation above.</div>`;
    return;
  }

  // Unique per-mount id suffix so this instance's elements can never collide with another
  // diagram instance's elements of the same pattern (e.g. if one was left running).
  diagramInstanceCounter++;
  const uid = "d"+diagramInstanceCounter;
  const id = (name)=> `${name}_${uid}`;

  let input = spec.defaultInput();
  let steps = spec.compute(input);
  let idx = 0;
  let playing = false;
  let timer = null;

  function render(){
    container.innerHTML = `
      <p class="diag-sandbox-note">${spec.intro} This is a standalone sandbox — edit the values and Apply, independent of the problem above.</p>
      <div class="diag-controls" id="${id('diagControls')}"></div>
      <div class="diag-stage" id="${id('diagStage')}"></div>
      <div class="diag-status" id="${id('diagStatus')}" aria-live="polite"></div>
      <div class="diag-transport">
        <button class="btn secondary" id="${id('diagPrev')}" aria-label="Previous step">◀ Step</button>
        <button class="btn" id="${id('diagPlay')}">▶ Play</button>
        <button class="btn secondary" id="${id('diagNext')}" aria-label="Next step">Step ▶</button>
        <input type="range" class="diag-slider" id="${id('diagSlider')}" aria-label="Step" min="0" max="${Math.max(0,steps.length-1)}" value="${idx}">
        <span class="diag-count" id="${id('diagCount')}"></span>
        <button class="btn secondary" id="${id('diagReset')}">Reset</button>
      </div>
    `;
    const controlsEl = document.getElementById(id('diagControls'));
    controlsEl.innerHTML = spec.controlsHtml(input);
    spec.wireControls(controlsEl, input, applyInput);
    draw();
    wireTransport();
  }
  function applyInput(newInput){
    stopPlay();
    input = newInput;
    steps = spec.compute(input);
    idx = 0;
    render();
  }
  function draw(){
    const stageEl = document.getElementById(id('diagStage'));
    if(!stageEl) { stopPlay(); return; } // instance's DOM is gone — nothing left to update
    spec.renderStep(stageEl, steps[idx], input);
    document.getElementById(id('diagStatus')).textContent = steps[idx].message || "";
    document.getElementById(id('diagSlider')).max = Math.max(0, steps.length-1);
    document.getElementById(id('diagSlider')).value = idx;
    document.getElementById(id('diagCount')).textContent = (idx+1)+" / "+steps.length;
    document.getElementById(id('diagPrev')).disabled = idx===0;
    document.getElementById(id('diagNext')).disabled = idx===steps.length-1;
  }
  function stopPlay(){
    playing=false; clearInterval(timer);
    const btn = document.getElementById(id('diagPlay'));
    if(btn) btn.textContent = "▶ Play";
  }
  function wireTransport(){
    document.getElementById(id('diagPrev')).onclick = ()=>{ stopPlay(); if(idx>0){ idx--; draw(); } };
    document.getElementById(id('diagNext')).onclick = ()=>{ stopPlay(); if(idx<steps.length-1){ idx++; draw(); } };
    document.getElementById(id('diagReset')).onclick = ()=>{ stopPlay(); idx=0; draw(); };
    document.getElementById(id('diagSlider')).oninput = (e)=>{ stopPlay(); idx=parseInt(e.target.value,10)||0; draw(); };
    document.getElementById(id('diagPlay')).onclick = ()=>{
      if(playing){ stopPlay(); return; }
      if(idx>=steps.length-1) idx=0;
      playing=true;
      document.getElementById(id('diagPlay')).textContent = "⏸ Pause";
      timer = setInterval(()=>{
        if(idx<steps.length-1){ idx++; draw(); } else { stopPlay(); }
      }, 850);
    };
  }

  stopActiveDiagram = stopPlay;
  render();
}

let libraryFilter = "";

function renderPatternLibrary(){
  const el = document.getElementById("view-patterns");
  if(selectedPatternId){
    renderPatternDetail(selectedPatternId);
    return;
  }
  el.innerHTML = `
    <div class="page-eyebrow">02 / PATTERN LIBRARY</div>
    <h1>Reference Patterns</h1>
    <p class="page-desc">One canonical page per pattern — clues, data structures, complexity, and a template. Built for recognition, not full tutorials.</p>

    <div class="pattern-grid" id="patternGrid"></div>
  `;
  renderPatternGrid();

  search.oninput = (e)=>{ libraryFilter = e.target.value; renderPatternGrid(); };

function renderPatternGrid(){
  const grid = document.getElementById("patternGrid");
  if(!grid) return;
  const stats = computePatternStats();
  const q = libraryFilter.trim().toLowerCase();
  const filtered = PATTERNS.filter(p =>
    !q ||
    p.name.toLowerCase().includes(q) ||
    p.category.toLowerCase().includes(q) ||
    p.clues.some(c=>c.toLowerCase().includes(q))
  );
  grid.innerHTML = filtered.map(p=>{
    const s = stats[p.id];
    const acc = s.attempts ? Math.round((s.correct/s.attempts)*100)+"%" : "not attempted";
    return `
    <button type="button" class="pattern-card" data-pid="${p.id}">
      <span class="pattern-card-cat" style="display:block;">${p.category}</span>
      <span class="pattern-card-name" style="display:block;">${p.name}</span>
      <span class="pattern-card-desc" style="display:block;">${p.description}</span>
      <span class="pattern-card-acc" style="display:block;">RECOGNITION: ${acc}</span>
    </button>`;
  }).join("") || `<div class="empty-state">No patterns match "${escapeHtml(libraryFilter)}".</div>`;
  const count = document.getElementById("libCount");
  if(count) count.textContent = q ? `${filtered.length} of ${PATTERNS.length} patterns` : "";
  grid.querySelectorAll("[data-pid]").forEach(el2=>{
    el2.onclick = ()=>{ selectedPatternId = el2.dataset.pid; renderPatternLibrary(); window.scrollTo(0,0); };
  });
}

function renderProgress(){
  const el = document.getElementById("view-progress");
  const attempts = loadAttempts();
  const stats = computePatternStats();
  const totalAttempts = attempts.length;
  const totalCorrect = attempts.filter(a=>a.patternCorrect).length;
  const overallAcc = totalAttempts ? Math.round((totalCorrect/totalAttempts)*100) : 0;
  const patternsAttempted = Object.values(stats).filter(s=>s.attempts>0).length;

  const sortedPatterns = PATTERNS
    .map(p=>({p, s:stats[p.id]}))
    .filter(x=>x.s.attempts>0)
    .sort((a,b)=> (b.s.correct/b.s.attempts) - (a.s.correct/a.s.attempts));

  el.innerHTML = `
    <div class="page-eyebrow">03 / PROGRESS</div>
    <h1>Recognition Performance</h1>
    <p class="page-desc">Tracks whether you named the right pattern — the core recognition skill this app trains toward.</p>

    <div class="stat-row">
      <div class="stat-box"><div class="stat-num">${totalAttempts}</div><div class="stat-lbl">TOTAL ATTEMPTS</div></div>
      <div class="stat-box"><div class="stat-num">${totalAttempts?overallAcc+'%':'—'}</div><div class="stat-lbl">PATTERN ACCURACY</div></div>
      <div class="stat-box"><div class="stat-num">${patternsAttempted}/${PATTERNS.length}</div><div class="stat-lbl">PATTERNS TOUCHED</div></div>
    </div>

    <div class="card">
      <div class="card-label">Your Pattern Performance</div>
      ${sortedPatterns.length ? sortedPatterns.map(({p,s})=>{
        const acc = Math.round((s.correct/s.attempts)*100);
        const cls = acc<60?'weak':(acc>=85?'strong':'');
        return `
        <div class="perf-row">
          <div class="perf-name">${p.name}</div>
          <div class="perf-bar-track" aria-hidden="true"><div class="perf-bar-fill ${cls}" style="width:${acc}%"></div></div>
          <div class="perf-pct">${acc}%</div>
        </div>`;
      }).join("") : `<div class="empty-state">No attempts yet. Head to Practice to start a session.</div>`}
    </div>

    ${sortedPatterns.length ? `
    <div class="card">
      <div class="card-label">Weak Areas</div>
      <p style="font-size:13px; color:var(--text-dim); margin:0 0 14px;">Patterns below 60% recognition accuracy — good candidates for your next session.</p>
      <div class="btn-row" style="margin-top:0;">
        <button class="btn" id="btnPracticeWeak">Practice Weakest Pattern</button>
      </div>
    </div>` : ''}

    <div class="card">
      <div class="card-label">Attempt History</div>
      ${attempts.length ? [...attempts].reverse().slice(0,25).map(a=>{
        const p = PROBLEMS.find(x=>x.id===a.problemId);
        const pat = PATTERNS.find(x=>x.id===a.pattern);
        const d = new Date(a.timestamp);
        return `
        <div class="history-row">
          <div class="history-left">
            <span class="history-dot ${a.patternCorrect?'ok':'no'}" role="img" aria-label="${a.patternCorrect?'correct':'incorrect'}"></span>
            <span>${p?p.title:'Unknown problem'}</span>
            <span style="color:var(--text-faint);">— ${pat?pat.name:a.pattern}</span>
          </div>
          <span class="history-time">${d.toLocaleDateString()} ${d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
        </div>`;
      }).join("") : `<div class="empty-state">Nothing here yet.</div>`}
    </div>

    ${attempts.length ? `
    <div class="btn-row">
      <button class="btn secondary" id="btnResetProgress">Reset progress</button>
    </div>` : ''}
  `;

  const resetBtn = document.getElementById("btnResetProgress");
  if(resetBtn) resetBtn.onclick = ()=>{
    if(!confirm("Delete all " + attempts.length + " saved attempts? This can't be undone.")) return;
    clearAttempts();
    renderProgress();
    renderSidebarFoot();
  };

  const weakBtn = document.getElementById("btnPracticeWeak");
  if(weakBtn) weakBtn.onclick = ()=>{
    const w = weakestPattern();
    currentProblem = null; quizState = null;
    setView("practice");
    startNewProblem(pickRandomProblem(w) || pickRandomProblem());
  };
}

/* =========================================================
   INIT
========================================================= */
renderPractice();
renderPatternLibrary();
renderProgress();
renderSidebarFoot();
</script>
</body>
</html>
