<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pattern Trace — LeetCode Pattern Recognition Trainer</title>
<meta name="description" content="Train yourself to recognise the algorithm pattern, data structures and complexity of LeetCode problems before you solve them — with spaced repetition and step-through visualisations.">
<meta name="theme-color" content="#0a0e17" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f6f2" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0e17'/%3E%3Cpath d='M8 22l6-6 4 4 6-8' fill='none' stroke='%23f5b84a' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script>
  // Apply the saved theme before first paint to avoid a flash.
  try {
    var t = (JSON.parse(localStorage.getItem("pt.v2") || "{}").settings || {}).theme;
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    else if (window.matchMedia("(prefers-color-scheme: light)").matches) document.documentElement.dataset.theme = "light";
  } catch (e) {}
</script>
</head>

<a class="skip-link" href="#main">Skip to content</a>

      <span><span class="brand-name">PATTERN<b>//</b>TRACE</span><span class="brand-sub" style="display:block">recognition trainer</span></span>
    </a>
    <nav class="nav" aria-label="Main" data-nav></nav>

      <a class="brand" href="#/">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" style="width:26px;height:26px"><rect width="32" height="32" rx="8" fill="var(--panel-3)"/><path d="M8 22l6-6 4 4 6-8" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="12" r="2.2" fill="var(--accent)"/></svg>
        <span class="brand-name">PATTERN<b>//</b>TRACE</span>
      </a>
      <div class="topbar-actions">
        <span class="tag tag-accent" data-streak-mini hidden></span>
        <a class="icon-btn" href="/projects.html" aria-label="All projects"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
