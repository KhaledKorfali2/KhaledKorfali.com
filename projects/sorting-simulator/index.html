<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sortvis: watch 12 sorting algorithms (bubble, insertion, merge, quick, heap, radix and more) step by step, with live comparison, swap and write counts.">
  <meta name="theme-color" content="#0d0d0d">
  <title>Sortvis — Sorting Algorithm Visualizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="tutorial.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c0c0c'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23e8541a'/%3E%3C/svg%3E">
<link rel="canonical" href="https://khaledkorfali.com/projects/sorting-simulator/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Khaled Korfali">
<meta property="og:title" content="Sorting Algorithm Simulator — Khaled Korfali">
<meta property="og:description" content="Sortvis: watch 12 sorting algorithms (bubble, insertion, merge, quick, heap, radix and more) step by step, with live comparison, swap and write counts.">
<meta property="og:url" content="https://khaledkorfali.com/projects/sorting-simulator/">
<meta property="og:image" content="https://khaledkorfali.com/screenshots/sorting-alg.webp">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>

  <!-- Header -->
  <header id="hdr">
    <div id="hdr-left">
      <a id="back-link" href="/projects.html" aria-label="Back to projects" title="Back to projects">&larr;</a>
      <span id="logo">SORTVIS</span>
      <span id="tagline">algorithm visualizer</span>
    </div>
    <div id="hdr-stats" aria-live="off">
      <div class="stat"><span class="stat-val" id="st-comps">0</span><span class="stat-lbl">comps</span></div>
      <div class="stat"><span class="stat-val" id="st-swaps">0</span><span class="stat-lbl">swaps</span></div>
      <div class="stat"><span class="stat-val" id="st-writes">0</span><span class="stat-lbl">writes</span></div>
    </div>
  </header>

  <!-- Algorithm picker -->
  <nav id="algo-nav" aria-label="Sorting algorithm">
    <button type="button" class="algo-btn active" aria-pressed="true" data-algo="bubble">Bubble</button>
    <button type="button" class="algo-btn" aria-pressed="false" data-algo="selection">Selection</button>
    <button type="button" class="algo-btn" aria-pressed="false" data-algo="insertion">Insertion</button>
    <button type="button" class="algo-btn" aria-pressed="false" data-algo="shell">Shell</button>
    <button type="button" class="algo-btn" aria-pressed="false" data-algo="merge">Merge</button>
    <button type="button" class="algo-btn" aria-pressed="false" data-algo="quick">Quick</button>
    <button type="button" class="algo-btn" aria-pressed="false" data-algo="heap">Heap</button>
    <button type="button" class="algo-btn" aria-pressed="false" data-algo="radix">Radix</button>
    <button type="button" class="algo-btn" aria-pressed="false" data-algo="counting">Counting</button>
    <button type="button" class="algo-btn" aria-pressed="false" data-algo="cocktail">Cocktail</button>
    <button type="button" class="algo-btn" aria-pressed="false" data-algo="gnome">Gnome</button>
    <button type="button" class="algo-btn" aria-pressed="false" data-algo="comb">Comb</button>
  </nav>

  <!-- Main area -->
  <main id="main">

    <!-- Visualizer canvas -->
    <section id="vis-wrap">
      <canvas id="vis" role="img" aria-label="Bar chart of the array being sorted. Use Space to play or pause and the arrow keys to step."></canvas>
      <div id="done-banner" class="hidden" role="status">
        <span id="done-text">Sorted!</span>
      </div>
    </section>

    <!-- Info panel (desktop sidebar / mobile bottom sheet) -->
    <aside id="info-panel" aria-label="Algorithm details">
      <!-- Mobile drag handle -->
      <div id="panel-handle" aria-hidden="true"><div id="panel-handle-bar"></div></div>
      <div id="algo-name-wrap">
        <h2 id="algo-title">Bubble Sort</h2>
        <div id="complexity-row">
          <span class="badge" id="badge-best"></span>
          <span class="badge" id="badge-avg"></span>
          <span class="badge" id="badge-worst"></span>
          <span class="badge" id="badge-space"></span>
        </div>
      </div>
      <p id="algo-desc"></p>
      <div id="step-log-wrap">
        <div id="step-log-label">CURRENT STEP</div>
        <div id="step-log" role="log" aria-live="polite"></div>
      </div>
    </aside>

  </main>

  <!-- Controls -->
  <footer id="controls">

    <div id="ctrl-left">
      <div class="ctrl-group">
        <label class="ctrl-label" for="sl-size">SIZE</label>
        <input type="range" id="sl-size" min="8" max="80" value="40" step="1">
        <span class="ctrl-val" id="v-size">40</span>
      </div>
      <div class="ctrl-group">
        <label class="ctrl-label" for="sl-speed">SPEED</label>
        <input type="range" id="sl-speed" min="1" max="10" value="5" step="1">
        <span class="ctrl-val" id="v-speed">5</span>
      </div>
    </div>

    <div id="ctrl-center">
      <button type="button" class="ctrl-btn" id="btn-reset" title="New array (R)" aria-label="New array (R)">&#8635;</button>
      <button type="button" class="ctrl-btn" id="btn-step-back" title="Step back (←)" aria-label="Step back (Left arrow)">&#9664;&#9664;</button>
      <button type="button" class="ctrl-btn primary" id="btn-play" title="Play / pause (Space)" aria-label="Play">&#9654;</button>
      <button type="button" class="ctrl-btn" id="btn-step-fwd" title="Step forward (→)" aria-label="Step forward (Right arrow)">&#9654;&#9654;</button>
      <button type="button" class="ctrl-btn" id="btn-end" title="Jump to end (End)" aria-label="Jump to end (End)">&#9654;|</button>
    </div>

    <div id="ctrl-right">
      <div class="ctrl-group">
        <label class="ctrl-label" for="sel-input">INPUT</label>
        <select id="sel-input">
          <option value="random">Random</option>
          <option value="nearly">Nearly sorted</option>
          <option value="reversed">Reversed</option>
          <option value="few">Few unique</option>
        </select>
      </div>
      <div id="progress-wrap">
        <div id="progress-bar"><div id="progress-fill"></div></div>
        <span id="progress-text" aria-label="Step progress">0 / 0</span>
      </div>
    </div>

    <!-- Mobile-only bottom row: size + input type -->
    <div id="ctrl-mobile-extra">
      <div class="ctrl-group">
        <label class="ctrl-label" for="sl-size-m">SIZE</label>
        <input type="range" id="sl-size-m" min="8" max="50" value="30" step="1">
        <span class="ctrl-val" id="v-size-m">30</span>
      </div>
      <div class="ctrl-group">
        <label class="ctrl-label" for="sl-speed-m">SPEED</label>
        <input type="range" id="sl-speed-m" min="1" max="10" value="5" step="1">
        <span class="ctrl-val" id="v-speed-m">5</span>
      </div>
      <button type="button" class="ctrl-btn ghost" id="btn-info" title="Algorithm info" aria-label="Algorithm info" aria-expanded="false" aria-controls="info-panel">&#9432;</button>
    </div>

  </footer>

  <script src="engine.js"></script>
  <script src="app.js"></script>
  <script src="tutorial.js"></script>
  <script src="sortvis-tutorial.js"></script>
</body>
</html>
