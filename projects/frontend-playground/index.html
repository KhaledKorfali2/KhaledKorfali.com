<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Playground — Khaled Korfali</title>
  <meta name="description" content="An interactive CSS playground: tweak live sliders and edit real CSS to learn the box model, flexbox, grid, animation, and more.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600&family=JetBrains+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c0c0c'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23e8541a'/%3E%3C/svg%3E">
<link rel="canonical" href="https://khaledkorfali.com/projects/frontend-playground/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Khaled Korfali">
<meta property="og:title" content="Frontend Playground — Khaled Korfali">
<meta property="og:description" content="An interactive CSS playground: tweak live sliders and edit real CSS to learn the box model, flexbox, grid, animation, and more.">
<meta property="og:url" content="https://khaledkorfali.com/projects/frontend-playground/">
<meta property="og:image" content="https://khaledkorfali.com/screenshots/css-playground.webp">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>

  <!-- ── Left sidebar: lesson nav ── -->
  <aside id="sidebar">
    <div id="sidebar-header">
      <span class="logo-mark">{}</span>
      <span class="logo-text">CSS Playground</span>
      <a href="/projects.html" class="back-link" data-tip="Back to projects" aria-label="Back to projects">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7H2M6 3L2 7l4 4"/></svg>
      </a>
      <button id="sidebarCollapseBtn" class="pane-collapse-btn" data-tip="Collapse sidebar" aria-label="Collapse sidebar">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 2L4 7l5 5"/></svg>
      </button>
    </div>
    <nav id="chapter-list" aria-label="Lessons"></nav>
    <div id="sidebar-footer">
      <span id="progress-label" aria-live="polite">0 / 0 complete</span>
      <div id="progress-bar-track" role="progressbar" aria-label="Lessons completed" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress-bar-fill"></div></div>
    </div>
    <!-- Sidebar resize handle -->
    <div id="sidebar-resize-handle" aria-hidden="true"></div>
  </aside>

  <!-- Sidebar collapsed: floating re-open tab -->
  <button id="sidebarExpandTab" aria-label="Open lesson list" aria-controls="sidebar">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 2l5 5-5 5"/></svg>
    <span>Lessons</span>
  </button>

  <!-- ── Main area ── -->
  <main id="main">

    <!-- Top strip -->
    <div id="topstrip">
      <div id="lesson-meta">
        <div id="lesson-meta-left">
          <span id="lesson-chapter">Chapter 1</span>
          <span id="lesson-type-badge" class="lesson-badge"></span>
        </div>
        <h1 id="lesson-title">Box Model</h1>
      </div>
      <div id="nav-btns">
        <button id="prevBtn" class="nav-btn" disabled aria-label="Previous lesson">← Prev</button>
        <button id="nextBtn" class="nav-btn" aria-label="Next lesson">Next →</button>
      </div>
    </div>

    <!-- Three-column workspace (flex row) -->
    <div id="workspace">

      <!-- Col 1: controls pane -->
      <div id="controls-pane">
        <div class="pane-header">
          <span class="pane-tag">CONTROLS</span>
          <button class="pane-collapse-btn" id="controlsCollapseBtn" data-tip="Collapse controls" aria-label="Collapse controls">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 1L3 6l5 5"/></svg>
          </button>
        </div>
        <div id="controls-body">
          <p id="lesson-desc"></p>
          <div id="concept-tags"></div>
          <div id="knobs-area"></div>
          <div id="lesson-callout" class="callout"></div>
        </div>
      </div>

      <!-- Resize handle: controls ↔ preview -->
      <div class="col-resize-handle" id="resize-handle-controls" aria-hidden="true"></div>

      <!-- Col 2: preview -->
      <div id="preview-pane">
        <!-- Controls pane collapsed: floating re-open button (lives in preview so it's always visible) -->
        <button id="controls-open-btn" aria-label="Open controls panel">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 1l5 5-5 5"/></svg>
          <span>Controls</span>
        </button>

        <div id="preview-label">
          <span class="pane-tag">PREVIEW</span>
          <div id="preview-actions">
            <button id="resetBtn" class="small-btn" data-tip="Reset to defaults">↺ Reset</button>
          </div>
        </div>
        <div id="preview-frame-wrap">
          <!-- sandbox="" (no tokens): opaque origin AND no script execution.
               Lessons are pure HTML/CSS, so nothing in the preview needs JS. -->
          <iframe
            id="preview-frame"
            sandbox=""
            title="Live preview"
            referrerpolicy="no-referrer"
          ></iframe>
        </div>
      </div>

      <!-- Resize handle: preview ↔ code -->
      <div class="col-resize-handle" id="resize-handle-code" aria-hidden="true"></div>

      <!-- Col 3: code pane (view + optional editor) -->
      <div id="code-pane">
        <div id="code-label">
          <span class="pane-tag">CODE</span>
          <div id="code-pane-right">
            <div id="code-tabs" role="group" aria-label="Code language">
              <button class="code-tab active" data-tab="css" aria-pressed="true">CSS</button>
              <button class="code-tab" data-tab="html" aria-pressed="false">HTML</button>
            </div>
            <button class="pane-collapse-btn" id="codeCollapseBtn" data-tip="Collapse code panel" aria-label="Collapse code panel">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 1l5 5-5 5"/></svg>
            </button>
          </div>
        </div>

        <!-- Read-only highlighted view (knob-driven lessons) -->
        <div id="code-scroll">
          <pre id="code-css"  class="code-block active"></pre>
          <pre id="code-html" class="code-block"></pre>
        </div>

        <!-- Editable mode (editor lessons) — hidden by default -->
        <div id="editor-area" style="display:none">
          <div id="editor-tabs" role="group" aria-label="Editor language">
            <button class="editor-tab active" data-etab="css" aria-pressed="true">CSS</button>
            <button class="editor-tab" data-etab="html" aria-pressed="false">HTML</button>
          </div>
          <div id="editor-wrap">
            <textarea id="editor-css"  class="code-editor" aria-label="CSS editor" aria-describedby="editor-keys" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
            <textarea id="editor-html" class="code-editor" aria-label="HTML editor" aria-describedby="editor-keys" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" style="display:none"></textarea>
          </div>
          <div id="editor-footer">
            <span id="editor-keys" class="editor-keys"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> apply · <kbd>Esc</kbd> then <kbd>Tab</kbd> to leave editor</span>
            <span id="editor-error" class="editor-error" role="status"></span>
            <button id="applyBtn" class="apply-btn">▶ Apply</button>
          </div>
          <div id="editor-hint" class="editor-hint"></div>
        </div>

        <!-- Code pane collapsed: floating re-open button -->
        <button id="code-open-btn" aria-label="Open code panel">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 1L3 6l5 5"/></svg>
          <span>Code</span>
        </button>
      </div>

    </div><!-- /workspace -->
  </main>

  <!-- Mobile sheet -->
  <div id="mobile-knobs-sheet" role="dialog" aria-label="Lesson controls" aria-hidden="true">
    <div id="mobile-sheet-handle" aria-hidden="true"></div>
    <p id="mobile-lesson-desc"></p>
    <div id="mobile-knobs-inner"></div>
  </div>
  <div id="mobile-sheet-backdrop" aria-hidden="true"></div>
  <button id="mobile-knobs-btn" aria-controls="mobile-knobs-sheet" aria-expanded="false">⚙ Controls</button>

  <!-- Tooltip -->
  <div id="tooltip" role="tooltip"></div>

  <script src="lessons.js"></script>
  <script src="script.js"></script>
</body>
</html>
